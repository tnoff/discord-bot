name: Scheduled

# Replaces the GitLab weekly pipeline schedule, deactivated in terraform!262.
# Same cron terraform derived for it, so the cadence is unchanged.

on:
  schedule:
    - cron: '24 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    name: Renovate
    uses: tnoff/github-workflows/.github/workflows/renovate.yml@adea087c43d56fd13d5b1abf2d5f2ba3e695784d  # renovate-v1.0.0
    secrets:
      app_client_id: ${{ secrets.CI_APP_CLIENT_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  branch-cleanup:
    name: Branch cleanup
    permissions:
      contents: write
      pull-requests: read
    uses: tnoff/github-workflows/.github/workflows/branch-cleanup.yml@adea087c43d56fd13d5b1abf2d5f2ba3e695784d  # branch-cleanup-v1.0.0
    with:
      age_days: 30
      dry_run: false
