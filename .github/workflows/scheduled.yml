name: Scheduled

# Replaces the GitLab weekly pipeline schedule, deactivated in terraform!262.
# Same cron terraform derived for it, so the cadence is unchanged.

on:
  schedule:
    - cron: '24 4 * * 1'
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Also run the full tox suite (the weekly schedule always does)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  renovate:
    name: Renovate
    uses: tnoff/github-workflows/.github/workflows/renovate.yml@3aba10f49a8c9f204e7df89c11ad0604a46e3496  # renovate-v1.1.9
    secrets:
      app_client_id: ${{ secrets.CI_APP_CLIENT_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  branch-cleanup:
    name: Branch cleanup
    permissions:
      contents: write
      pull-requests: read
    uses: tnoff/github-workflows/.github/workflows/branch-cleanup.yml@adea087c43d56fd13d5b1abf2d5f2ba3e695784d  # branch-cleanup-v1.0.0
    with:
      age_days: 30
      dry_run: false

  # The full test suite, every week and on demand.
  #
  # Pull requests run only the packages they can affect (tox.ini ->
  # ci/_run_tests.py), and gate 100% coverage only on the packages whose
  # SOURCE changed. A test-only edit that quietly lowers some other package's coverage,
  # or a break only reachable through a path the import graph cannot see, would
  # otherwise wait for the next PR that happens to run everything. This run is that
  # backstop: no pull request is in play, so ci/_run_tests.py runs the whole suite
  # and gates the combined total, exactly as before narrowing existed. A failure
  # reaches Discord through notify-failure.yml like any other scheduled job.
  #
  # Meant to be temporary: the goal is to remove this once the narrowing is trusted and
  # test-only edits are covered another way. Revisit rather than let it become permanent.
  #
  # Same pin and inputs as ci.yml's `tox` job; keep them in step.
  tox:
    name: Tox (full suite)
    # A manual run is usually just to kick Renovate, so it skips this unless asked;
    # the weekly schedule has no inputs and always runs it.
    if: github.event_name == 'schedule' || inputs.run_tests
    uses: tnoff/github-workflows/.github/workflows/tox.yml@fd3bbf52e18c2edfa3d6fe015bed6f7056cfa777  # tox-v1.0.2
    with:
      extra_apt: 'ffmpeg'
