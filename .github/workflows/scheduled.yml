name: Scheduled

# Replaces the GitLab weekly pipeline schedule, deactivated in terraform!262.
# Same cron terraform derived for it, so the cadence is unchanged.

on:
  schedule:
    - cron: '24 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    name: Renovate
    uses: tnoff/github-workflows/.github/workflows/renovate.yml@7211258c07503e00971c91988027b4f907ffe5b4
    secrets:
      renovate_token: ${{ secrets.RENOVATE_TOKEN }}

  branch-cleanup:
    name: Branch cleanup
    permissions:
      contents: write
      pull-requests: read
    uses: tnoff/github-workflows/.github/workflows/branch-cleanup.yml@7211258c07503e00971c91988027b4f907ffe5b4
    with:
      age_days: 30
      dry_run: false
