name: Scheduled

# Replaces the GitLab weekly pipeline schedule, deactivated in terraform!262.
# Same cron terraform derived for it, so the cadence is unchanged.

on:
  schedule:
    - cron: '24 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    name: Renovate
    uses: tnoff/github-workflows/.github/workflows/renovate.yml@2c7a6597fce4072fb2755f49742147e7482e6065
    secrets:
      app_client_id: ${{ secrets.CI_APP_CLIENT_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  branch-cleanup:
    name: Branch cleanup
    permissions:
      contents: write
      pull-requests: read
    uses: tnoff/github-workflows/.github/workflows/branch-cleanup.yml@2c7a6597fce4072fb2755f49742147e7482e6065
    with:
      age_days: 30
      dry_run: false
