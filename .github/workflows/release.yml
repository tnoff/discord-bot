name: Release

# Default-branch pipeline: fold the changelog, tag, push all six images, and
# ask docker-apps to bump each pin.
#
# ---------------------------------------------------------------------------
# The fold guard
# ---------------------------------------------------------------------------
# assemble-changelog pushes a "docs: assemble changelog for X" commit to main,
# which triggers this workflow a SECOND time. That second pass is what cuts the
# tag, because tag defers while fragments are still pending.
#
# The images must NOT be pushed twice and docker-apps must not be asked to bump
# twice. GitLab guarded this with .not-on-changelog-fold matching the commit
# message; this is the same guard. Without it the fold commit is byte-identical
# in the image context, so the push skips the tag write on a shared digest and
# trigger-bump pins docker-apps at a tag that was never written.
#
# ---------------------------------------------------------------------------
# Why push and trigger-bump are explicit jobs and not two matrices
# ---------------------------------------------------------------------------
# A matrix job's outputs are not addressable per leg -- there is no
# needs.push.outputs[matrix.image]. trigger-bump needs the `image` and
# `secondary_tag` that ITS OWN push produced, and deriving the tag
# independently instead is precisely how docker-apps ends up pinned to a tag
# that was never written. So the pairs stay explicit and wired one to one.
#
# The GitLab config needed a before_script per image to shell-export
# OCI_REPO_NAME_64, because GitLab does not reliably substitute one masked
# variable into another and every image would otherwise be pushed to the BOT
# repo. Here repo_name is a plain input, so that is simply gone.

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Decide WHICH images this push has to rebuild, not just whether any do.
  #
  # This used to be one boolean over `discord_*/*|alembic/*|docker/*|
  # pyproject.toml|VERSION` gating all six push jobs, so a change confined to
  # discord_db (#1017) still pushed and bumped gateway, dispatcher, broker,
  # downloader and search. ci.yml's `changes` job had already moved to a
  # per-image answer; this one was never wired to it, so the saving stopped at
  # the PR and the merge rebuilt everything anyway.
  #
  # The mapping is tests/cli/_affected_images.py against the measured closure in
  # tests/cli/image-closure.json -- the same call ci.yml makes, so a PR cannot
  # build one set of images and its own merge release another.
  #
  # Differences from ci.yml, both forced by the event: the base is
  # github.event.before rather than a PR base ref, and this FAILS OPEN. An
  # absent, all-zeros or unreachable base, or the script exiting non-zero (it
  # does so on an orphan file, which is right for a PR check), releases ALL
  # images. A build that did not need to happen costs minutes; a build that
  # silently did not happen leaves docker-apps pinned to a stale image and reads
  # exactly like a successful run.
  changes:
    name: Detect image-input changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      images: ${{ steps.filter.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Filter
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          ZERO=0000000000000000000000000000000000000000
          # Every image the closure knows about: the fail-open answer.
          ALL="$(python3 -c "import json; print(json.dumps(sorted(i['image'] for i in json.load(open('tests/cli/image-closure.json'))['images'])))")"
          if [ -z "${BEFORE}" ] || [ "${BEFORE}" = "${ZERO}" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "no usable base ref (${BEFORE:-empty}) -- building all"
            echo "images=${ALL}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Diagnostics go to stderr (the job log), `images=...` to stdout.
          if OUT="$(python3 -m tests.cli._affected_images --base "${BEFORE}" --head "${AFTER}")"; then
            IMAGES="$(printf '%s\n' "${OUT}" | sed -n 's/^images=//p')"
          else
            echo "::warning::_affected_images failed -- building all"
            IMAGES="${ALL}"
          fi
          echo "images to build: ${IMAGES}"
          echo "images=${IMAGES}" >> "$GITHUB_OUTPUT"

  assemble-changelog:
    name: Assemble changelog
    permissions:
      contents: write
    uses: tnoff/github-workflows/.github/workflows/assemble-changelog.yml@dddd091a6a69e8bf070f63863d59c04bb4a5db63
    secrets:
      app_client_id: ${{ secrets.CI_APP_CLIENT_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  tag:
    name: Tag
    needs: assemble-changelog
    permissions:
      contents: write
    uses: tnoff/github-workflows/.github/workflows/tag.yml@dddd091a6a69e8bf070f63863d59c04bb4a5db63
    with:
      gate_on_fragments: true
    secrets:
      app_client_id: ${{ secrets.CI_APP_CLIENT_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  # Per-package tags, one `<short>-v<version>` tag per package, driven off
  # each package's own VERSION file (criterion 8 step 6 -- see DEVELOPMENT.md's
  # "Per-package versions"). This is deliberately ONE job with a loop over a
  # declared list, not seven near-identical copies: #922's push-db gap --
  # discord-db added to five of six hand-copied per-image lists and missed
  # release.yml, building green while shipping nothing for four days -- is the
  # exact failure mode a per-package copy-paste here would repeat, and the
  # lesson this repo already paid for is "loop over one declared source",
  # not "copy carefully". The short-name table is PACKAGE_ROOTS in
  # tests/cli/_package_versions.py, the same module the `package-versions`
  # job in ci.yml imports -- not a second table hand-written here.
  #
  # Cannot reuse the shared tag.yml workflow this file's own `tag:` job calls:
  # that workflow's tag format is hardcoded to a literal `v{VERSION}` prefix
  # with no namespace input, so two packages at the same numeric version would
  # collide on an identical tag string and the second call would silently
  # no-op (tag.yml treats an existing tag as already-done). So this pushes
  # tags directly instead, idempotently (git ls-remote first, skip if already
  # there), using the same GitHub App credentials already passed to every
  # other job in this file, via actions/create-github-app-token rather than a
  # reusable workflow, since this job runs the git plumbing itself.
  #
  # needs assemble-changelog (not changes): tags are not gated on whether an
  # image needs rebuilding, the same independence the `tag:` job above has
  # from `changes` -- a docs-only merge still gets its per-package tags if a
  # package's own VERSION moved. It still waits on assemble-changelog, the
  # same dependency `tag:` has, so this runs after the changelog fold rather
  # than racing it.
  package-tags:
    name: Tag packages
    needs: assemble-changelog
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Tag each package that needs one
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # short-name -> import-root, read straight from the one place this
          # repo declares it (PACKAGE_ROOTS in tests/cli/_package_versions.py)
          # rather than a second copy here. Standard library only, no install
          # step needed, same property _package_versions.py itself relies on.
          python3 <<'PY' > /tmp/package-roots.txt
          from tests.cli._package_versions import PACKAGE_ROOTS
          for short, root in sorted(PACKAGE_ROOTS.items()):
              print(f'{short} {root}')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          remote="https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          while read -r short root; do
            version="$(cat "${root}/VERSION")"
            tag="${short}-v${version}"
            if git ls-remote --exit-code --tags "${remote}" "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "${tag}: already exists, skipping"
              continue
            fi
            echo "${tag}: creating"
            git tag "${tag}" "${GITHUB_SHA}"
            git push "${remote}" "refs/tags/${tag}"
          done < /tmp/package-roots.txt

  push-gateway:
    name: Push gateway image
    needs: changes
    if: >-
      ${{ contains(fromJSON(needs.changes.outputs.images), 'gateway')
          && !startsWith(github.event.head_commit.message, 'docs: assemble changelog') }}
    uses: tnoff/github-workflows/.github/workflows/docker-push.yml@dddd091a6a69e8bf070f63863d59c04bb4a5db63
    with:
      registry: ${{ vars.OCI_REGISTRY }}
      namespace: ${{ vars.OCI_NAMESPACE }}
      repo_name: ${{ vars.OCI_REPO_NAME_BOT }}
      dockerfile: docker/Dockerfile.gateway
    secrets:
      oci_username: ${{ secrets.OCI_USERNAME }}
      oci_token: ${{ secrets.OCI_TOKEN }}

  push-dispatcher:
    name: Push dispatcher image
    needs: changes
    if: >-
      ${{ contains(fromJSON(needs.changes.outputs.images), 'dispatcher')
          && !startsWith(github.event.head_commit.message, 'docs: assemble changelog') }}
    uses: tnoff/github-workflows/.github/workflows/docker-push.yml@dddd091a6a69e8bf070f63863d59c04bb4a5db63
    with:
      registry: ${{ vars.OCI_REGISTRY }}
      namespace: ${{ vars.OCI_NAMESPACE }}
      repo_name: ${{ vars.OCI_REPO_NAME_DISPATCHER }}
      dockerfile: docker/Dockerfile.dispatcher
    secrets:
      oci_username: ${{ secrets.OCI_USERNAME }}
      oci_token: ${{ secrets.OCI_TOKEN }}

  push-broker:
    name: Push broker image
    needs: changes
    if: >-
      ${{ contains(fromJSON(needs.changes.outputs.images), 'broker')
          && !startsWith(github.event.head_commit.message, 'docs: assemble changelog') }}
    uses: tnoff/github-workflows/.github/workflows/docker-push.yml@dddd091a6a69e8bf070f63863d59c04bb4a5db63
    with:
      registry: ${{ vars.OCI_REGISTRY }}
      namespace: ${{ vars.OCI_NAMESPACE }}
      repo_name: ${{ vars.OCI_REPO_NAME_BROKER }}
      dockerfile: docker/Dockerfile.broker
    secrets:
      oci_username: ${{ secrets.OCI_USERNAME }}
      oci_token: ${{ secrets.OCI_TOKEN }}

  push-downloader:
    name: Push downloader image
    needs: changes
    if: >-
      ${{ contains(fromJSON(needs.changes.outputs.images), 'downloader')
          && !startsWith(github.event.head_commit.message, 'docs: assemble changelog') }}
    uses: tnoff/github-workflows/.github/workflows/docker-push.yml@dddd091a6a69e8bf070f63863d59c04bb4a5db63
    with:
      registry: ${{ vars.OCI_REGISTRY }}
      namespace: ${{ vars.OCI_NAMESPACE }}
      repo_name: ${{ vars.OCI_REPO_NAME_DOWNLOADER }}
      dockerfile: docker/Dockerfile.downloader
    secrets:
      oci_username: ${{ secrets.OCI_USERNAME }}
      oci_token: ${{ secrets.OCI_TOKEN }}

  push-search:
    name: Push search image
    needs: changes
    if: >-
      ${{ contains(fromJSON(needs.changes.outputs.images), 'search')
          && !startsWith(github.event.head_commit.message, 'docs: assemble changelog') }}
    uses: tnoff/github-workflows/.github/workflows/docker-push.yml@dddd091a6a69e8bf070f63863d59c04bb4a5db63
    with:
      registry: ${{ vars.OCI_REGISTRY }}
      namespace: ${{ vars.OCI_NAMESPACE }}
      repo_name: ${{ vars.OCI_REPO_NAME_SEARCH }}
      dockerfile: docker/Dockerfile.search
    secrets:
      oci_username: ${{ secrets.OCI_USERNAME }}
      oci_token: ${{ secrets.OCI_TOKEN }}

  # The sixth image. It arrives here a release behind its ci.yml matrix leg:
  # #919 added `- image: db` to the build matrix and stopped there, so every PR
  # since has built and scanned this Dockerfile while nothing has ever pushed
  # it. The two build definitions are separate on purpose (ci.yml is a matrix,
  # release.yml is explicit pairs, for the outputs reason above), and that is
  # exactly what makes one of them easy to miss -- a green build matrix reads
  # as "this image ships".
  #
  # Its trigger-bump-db sibling now exists (bottom of this file). It was held
  # back on purpose: the bump job on the docker-apps side hard-fails when the
  # file holding the pin is absent (`[ -f "$f" ] || exit 1`), so the order had
  # to be push-db -> Phase A's manifest and bump job -> trigger-bump-db. Phase A
  # landed as docker-apps!1668 and pinned the tag this job produced.
  push-db:
    name: Push db image
    needs: changes
    if: >-
      ${{ contains(fromJSON(needs.changes.outputs.images), 'db')
          && !startsWith(github.event.head_commit.message, 'docs: assemble changelog') }}
    uses: tnoff/github-workflows/.github/workflows/docker-push.yml@dddd091a6a69e8bf070f63863d59c04bb4a5db63
    with:
      registry: ${{ vars.OCI_REGISTRY }}
      namespace: ${{ vars.OCI_NAMESPACE }}
      repo_name: ${{ vars.OCI_REPO_NAME_DB }}
      dockerfile: docker/Dockerfile.db
    secrets:
      oci_username: ${{ secrets.OCI_USERNAME }}
      oci_token: ${{ secrets.OCI_TOKEN }}

  trigger-bump-gateway:
    name: Trigger docker-apps bump (gateway)
    needs: push-gateway
    uses: tnoff/github-workflows/.github/workflows/trigger-bump-dispatch.yml@dddd091a6a69e8bf070f63863d59c04bb4a5db63
    with:
      bump_source: discord-gateway
      image: ${{ needs.push-gateway.outputs.image }}
      image_tag: ${{ needs.push-gateway.outputs.secondary_tag }}
    secrets:
      app_client_id: ${{ secrets.CI_APP_CLIENT_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  trigger-bump-dispatcher:
    name: Trigger docker-apps bump (dispatcher)
    needs: push-dispatcher
    uses: tnoff/github-workflows/.github/workflows/trigger-bump-dispatch.yml@dddd091a6a69e8bf070f63863d59c04bb4a5db63
    with:
      bump_source: discord-dispatcher
      image: ${{ needs.push-dispatcher.outputs.image }}
      image_tag: ${{ needs.push-dispatcher.outputs.secondary_tag }}
    secrets:
      app_client_id: ${{ secrets.CI_APP_CLIENT_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  trigger-bump-broker:
    name: Trigger docker-apps bump (broker)
    needs: push-broker
    uses: tnoff/github-workflows/.github/workflows/trigger-bump-dispatch.yml@dddd091a6a69e8bf070f63863d59c04bb4a5db63
    with:
      bump_source: discord-broker
      image: ${{ needs.push-broker.outputs.image }}
      image_tag: ${{ needs.push-broker.outputs.secondary_tag }}
    secrets:
      app_client_id: ${{ secrets.CI_APP_CLIENT_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  trigger-bump-downloader:
    name: Trigger docker-apps bump (downloader)
    needs: push-downloader
    uses: tnoff/github-workflows/.github/workflows/trigger-bump-dispatch.yml@dddd091a6a69e8bf070f63863d59c04bb4a5db63
    with:
      bump_source: discord-downloader
      image: ${{ needs.push-downloader.outputs.image }}
      image_tag: ${{ needs.push-downloader.outputs.secondary_tag }}
    secrets:
      app_client_id: ${{ secrets.CI_APP_CLIENT_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  trigger-bump-search:
    name: Trigger docker-apps bump (search)
    needs: push-search
    uses: tnoff/github-workflows/.github/workflows/trigger-bump-dispatch.yml@dddd091a6a69e8bf070f63863d59c04bb4a5db63
    with:
      bump_source: discord-search
      image: ${{ needs.push-search.outputs.image }}
      image_tag: ${{ needs.push-search.outputs.secondary_tag }}
    secrets:
      app_client_id: ${{ secrets.CI_APP_CLIENT_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  # Closes the loop opened in #922. docker-apps!1668 added
  # apps/discord/db-app.yaml and the bump-discord-db-pin job, so BUMP_SOURCE
  # "discord-db" now resolves to a real IMAGE_FILE and the base job's
  # `[ -f "$f" ] || exit 1` guard is satisfied.
  #
  # Until this job existed the pin sat frozen at 9e5d00a while push-db kept
  # producing tags nothing consumed -- so the db pod was the one tier that did
  # NOT pick up a merge to main. The first run of this job therefore carries
  # #923 (connection pooling and the untraced liveness probe) onto the pod.
  trigger-bump-db:
    name: Trigger docker-apps bump (db)
    needs: push-db
    uses: tnoff/github-workflows/.github/workflows/trigger-bump-dispatch.yml@dddd091a6a69e8bf070f63863d59c04bb4a5db63
    with:
      bump_source: discord-db
      image: ${{ needs.push-db.outputs.image }}
      image_tag: ${{ needs.push-db.outputs.secondary_tag }}
    secrets:
      app_client_id: ${{ secrets.CI_APP_CLIENT_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}
