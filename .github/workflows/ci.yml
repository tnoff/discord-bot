name: CI

# Pull-request checks, ported from .gitlab-ci.yml's pr-check and test stages.
# Shared jobs come from tnoff/github-workflows, SHA-pinned the same way the
# GitLab `include:` refs were; Renovate's github-actions manager keeps the
# pins current.

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A PR that touches only catalog-info.yaml or renovate.json changes nothing any
  # job here inspects: no source, no image input, no packaging metadata, no
  # workflow. So all of them gate on this and CI reduces to the aggregate.
  #
  # This MUST stay a job-level `if:` and never become a workflow-level
  # `paths-ignore`. The branch ruleset requires the `CI result` context;
  # `paths-ignore` stops the whole workflow, so that context never reports at all
  # -- and a required check that never reports blocks the PR forever, where a
  # SKIPPED job scores as success. The two failure modes look nothing alike.
  #
  # Two files, named exactly, anchored. Not a prefix, not a glob, not a
  # deny-list of "things that feel unimportant": a list that grows by feel is one
  # somebody eventually adds a file to that did matter.
  #
  # An empty or unreadable diff yields false, which runs everything.
  metadata:
    name: Detect metadata-only change
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      only: ${{ steps.filter.outputs.only }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Filter
        id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin "${BASE_REF}"
          FILES="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          ONLY=false
          if [ -n "${FILES}" ]; then
            OTHER="$(printf '%s\n' "${FILES}" | grep -vE '^(catalog-info\.yaml|renovate\.json)$' || true)"
            [ -z "${OTHER}" ] && ONLY=true
          fi
          echo "changed files:"
          printf '%s\n' "${FILES}" | sed -n 's/^/  /p'
          echo "metadata-only: ${ONLY}"
          echo "only=${ONLY}" >> "$GITHUB_OUTPUT"

  secrets:
    name: Scan for secrets
    needs: metadata
    if: needs.metadata.outputs.only != 'true'
    uses: tnoff/github-workflows/.github/workflows/trufflehog.yml@adea087c43d56fd13d5b1abf2d5f2ba3e695784d  # trufflehog-v1.0.0

  tox:
    name: Tox
    needs: metadata
    if: needs.metadata.outputs.only != 'true'
    uses: tnoff/github-workflows/.github/workflows/tox.yml@adea087c43d56fd13d5b1abf2d5f2ba3e695784d  # tox-v1.0.0
    with:
      # ffmpeg is NOT optional here, unlike the other repos ported from the same
      # ci-base-images base. Two tests shell out to it directly
      # (FileNotFoundError: 'ffmpeg'), which is what the first run of this
      # workflow caught: 2 failed, 2184 passed.
      extra_apt: 'ffmpeg'

  # Which images this PR can actually change.
  #
  # This used to be a single boolean over `discord_bot/*|alembic/*|docker/*|
  # pyproject.toml|VERSION`, so ANY match built and trufflehog-scanned all six.
  # Measured over 80 commits, that was six builds where two would do: module
  # fanout forces all six on 2% of them, and the rest were `VERSION` (genuinely
  # all-six) and `pyproject.toml` (which is not -- extras are per-image, so a
  # [test] bump changes no image at all and rebuilt every one).
  #
  # The mapping lives in tests/cli/_affected_images.py against the MEASURED
  # closure in tests/cli/image-closure.json, not in shell here. Two reasons: the
  # closure has to come from importing each entrypoint (a static walk misses the
  # one PEP 562 import in the tree), and a filter with real edge cases -- a
  # deleted module, an unparseable base -- deserves tests, which shell in a
  # workflow cannot have.
  #
  # It is deliberately allowed to FAIL. A file no image's closure claims is
  # ambiguous between dead code and a gap in the graph, and only one of those is
  # safe to skip; see the 2026-09-04 finding for what the silent version costs.
  #
  # Still git rather than a path-filter action, and still not a workflow-level
  # `paths:` filter -- that would gate the secret scan and the tox matrix too.
  changes:
    name: Detect image-input changes
    needs: metadata
    if: needs.metadata.outputs.only != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
      any: ${{ steps.filter.outputs.any }}
      images: ${{ steps.filter.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Filter
        id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin "${BASE_REF}"
          # Standard library only, and no install step: the module reads the
          # committed closure and pyproject rather than importing the package.
          # Diagnostics go to stderr, the three outputs to stdout.
          python3 -m tests.cli._affected_images --base "origin/${BASE_REF}" >> "$GITHUB_OUTPUT"

  # One leg per image this PR can actually change, not one per image that
  # exists. GitLab needed TEN jobs for this -- five buildkit-build-check plus
  # five trufflehog-image, with the built image shipped between each pair as a
  # tarball through an object-storage bucket. docker-build-check builds and
  # scans in one job, so the bucket, the uploads and the downloads are gone.
  #
  # The matrix is GENERATED by `changes` rather than listed here. It was a
  # hardcoded image -> dockerfile table, which made this the second place the
  # set of images was written down; it now comes from IMAGE_DOCKERFILES in
  # tests/cli/_image_deps.py, checked against the filesystem by
  # test_every_dockerfile_exists. The 2026-09-04 finding is what a second copy
  # costs: discord-db was added to five of six places, missed release.yml, and
  # built green while shipping nothing for four days.
  #
  # `any` guards the job because an empty matrix is a workflow error, not an
  # empty run -- and "this PR changes no image" is now a common, correct answer
  # rather than an edge case.
  #
  # NOTE: conditional AND dynamically named, so these must never be added to
  # required_status_checks. A required check that skips blocks the merge, and
  # the leg names now vary per PR, so requiring one by name would block on a
  # context that may never report. `CI result` stays the required context.
  build:
    name: Build and scan
    needs: changes
    if: needs.changes.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    uses: tnoff/github-workflows/.github/workflows/docker-build-check.yml@adea087c43d56fd13d5b1abf2d5f2ba3e695784d  # docker-build-check-v1.0.0
    with:
      dockerfile: ${{ matrix.dockerfile }}

  # Each of the seven packages (discord_core plus the six pods) tracks its own
  # VERSION independently -- see DEVELOPMENT.md's "Per-package versions".
  # Renovate's dev- PRs are bumped by `bump-version` below; every other PR bumps
  # by hand, and this job catches the one that forgets to, the same shape as the
  # `changes` job above and for the same reason:
  # tests/cli/_package_versions.py reads the diff and tests/cli/_roots.py's
  # declared roots rather than a second hand-maintained list, so a package
  # cannot silently fall out of the check the way a hardcoded per-image list
  # has dropped one entry in this repo before.
  #
  # Standard library only, and no install step, matching `changes` above:
  # diagnostics go to stderr, the pass/fail message to stderr too, and the
  # exit code is the whole contract.
  package-versions:
    name: Detect package version bumps
    needs: metadata
    if: needs.metadata.outputs.only != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Check
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin "${BASE_REF}"
          python3 -m tests.cli._package_versions --base "origin/${BASE_REF}"

  # Criterion 8 step 7: each of the six pods now pins discord_core to a real
  # released tag in its own pyproject.toml (see tests/cli/_package_pins.py),
  # rather than installing it from this checkout -- the same shape
  # `dappertable` already used. Nothing stops a PR from bumping one pod's pin
  # without the other five, which would leave six pods running different
  # discord_core releases in production and nothing short of this check would
  # notice before then. Same shape as `package-versions` above: standard
  # library only, no install step, diagnostics to stderr, exit code is the
  # whole contract. Unlike `package-versions`, this does not diff against the
  # base branch -- it is not "did this PR bump a pin", it is "do the six pins
  # agree right now", so it checks the working tree directly and needs no
  # `--base`.
  package-pins:
    name: Detect discord_core pin drift
    needs: metadata
    if: needs.metadata.outputs.only != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check
        run: python3 -m tests.cli._package_pins

  bump-version:
    name: Bump version
    if: startsWith(github.head_ref, 'renovate/dev-')
    permissions:
      contents: write
    uses: tnoff/github-workflows/.github/workflows/bump-version.yml@adea087c43d56fd13d5b1abf2d5f2ba3e695784d  # bump-version-v1.0.0
    with:
      # Bumps each touched package's own VERSION (and drops a fragment in that
      # package's changelog.d/), not a repo-wide file -- there is none. The
      # command is tests/cli/_package_versions.py's `--list`: the same
      # "which packages did this PR touch" rule the `package-versions` job
      # below enforces, so the bump and the check cannot disagree.
      version_files_command: python3 -m tests.cli._package_versions --base "origin/${BASE_REF}" --list
      bump_changelog: true
    secrets:
      app_client_id: ${{ secrets.CI_APP_CLIENT_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  # Catches a `uses:` whose inputs or secrets no longer match the pinned callee.
  # That mismatch fails the calling workflow at STARTUP -- no job is created, no
  # check reports, and no `workflow_run` event fires -- so neither this checks
  # list nor notify-failure.yml can see it. It is how one upstream secret rename
  # left `Release` dead in nine repos for five days in September 2026.
  contracts:
    name: Workflow contracts
    needs: metadata
    if: needs.metadata.outputs.only != 'true'
    uses: tnoff/github-workflows/.github/workflows/check-workflow-contracts.yml@adea087c43d56fd13d5b1abf2d5f2ba3e695784d  # check-workflow-contracts-v1.0.0

  result:
    name: CI result
    # The stable name for the branch ruleset to require.
    #
    # Requiring the individual jobs by name does not gate anything: GitHub
    # scores a `skipped` required check as SUCCESS, and every shared workflow
    # here carries an `allow_fork_prs` gate that can skip its only job.
    #
    # Tox is the sharp case: its matrix legs come from `tox -l` at runtime,
    # so naming `tox (3.13)` couples this ruleset to a file in another repo,
    # and a required check that never reports blocks merging with no failing
    # job to point at.
    #
    # The image build is conditional on `changes`, so it is `skipped` on a
    # PR that touches no image input -- correct, and why skipped passes below.
    # It is also why the build legs must never be required by name: they
    # would pass vacuously.
    #
    # This job always runs and its name never changes, so the ruleset requires
    # exactly one context and the jobs underneath stay free to change.
    if: always()
    needs: [secrets, tox, changes, build, contracts, metadata, package-versions, package-pins]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Summarise
        run: |
          echo "secrets:           ${{ needs.secrets.result }}"
          echo "metadata:          ${{ needs.metadata.result }}"
          echo "tox:               ${{ needs.tox.result }}"
          echo "changes:           ${{ needs.changes.result }}"
          echo "build:             ${{ needs.build.result }}"
          echo "contracts:         ${{ needs.contracts.result }}"
          echo "package-versions:  ${{ needs.package-versions.result }}"
          echo "package-pins:      ${{ needs.package-pins.result }}"

      - name: Fail if any job failed
        # `skipped` is deliberately allowed: with allow_fork_prs false a fork
        # PR skips the cascade, which is the intended outcome, not a failure.
        if: >-
          needs.secrets.result == 'failure' || needs.secrets.result == 'cancelled' ||
          needs.tox.result == 'failure' || needs.tox.result == 'cancelled' ||
          needs.changes.result == 'failure' || needs.changes.result == 'cancelled' ||
          needs.build.result == 'failure' || needs.build.result == 'cancelled' ||
          needs.contracts.result == 'failure' || needs.contracts.result == 'cancelled' ||
          needs.metadata.result == 'failure' || needs.metadata.result == 'cancelled' ||
          needs.package-versions.result == 'failure' || needs.package-versions.result == 'cancelled' ||
          needs.package-pins.result == 'failure' || needs.package-pins.result == 'cancelled'
        run: |
          echo "::error::One or more CI jobs did not pass."
          exit 1
