name: CI

# Pull-request checks, ported from .gitlab-ci.yml's pr-check and test stages.
# Shared jobs come from tnoff/github-workflows, SHA-pinned the same way the
# GitLab `include:` refs were; Renovate's github-actions manager keeps the
# pins current.

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Scan for secrets
    uses: tnoff/github-workflows/.github/workflows/trufflehog.yml@362a5f0d06fec04588c60863ccf0bf2ce709917f

  # The suite has no sqlite fallback. tox.ini sets
  # POSTGRES_TEST_HOST = {env:POSTGRES_TEST_HOST:localhost}, so the variable is
  # always set under tox and conftest always takes its `noproc` branch --
  # meaning it connects to a REAL server at localhost:5432 as postgres/postgres.
  #
  # extra_apt alone cannot deliver that: apt gives you a server, not one
  # reachable over TCP with that password. tests/start_postgres_for_ci.sh does
  # the cluster start and the ALTER USER, but it guards on `id -u` = 0 and
  # exits 0 silently otherwise -- which was invisible on GitLab, where the
  # runner was root inside python:*-slim, and would silently skip here. Hence
  # pre_commands with sudo (github-workflows#38).
  tox:
    name: Tox
    uses: tnoff/github-workflows/.github/workflows/tox.yml@362a5f0d06fec04588c60863ccf0bf2ce709917f
    with:
      # ffmpeg is NOT optional here, unlike the other repos ported from the same
      # ci-base-images base. Two tests shell out to it directly
      # (FileNotFoundError: 'ffmpeg'), which is what the first run of this
      # workflow caught: 2 failed, 2184 passed.
      extra_apt: 'postgresql ffmpeg'
      pre_commands: 'sudo sh tests/start_postgres_for_ci.sh'

  # Reimplements .image-build-rules' `changes:` block: the image inputs are the
  # docker/ context, the python source, the migrations, deps and version.
  # Doc-only, test-only and workflow-pin PRs skip all five builds.
  #
  # Done with git rather than a path-filter action to avoid another pinned
  # dependency for ~10 lines of shell. A workflow-level `paths:` filter would
  # be wrong: it would gate the secret scan and the tox matrix too.
  changes:
    name: Detect image-input changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Filter
        id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin "${BASE_REF}"
          MATCH=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              discord_bot/*|alembic/*|alembic.ini|docker/*|pyproject.toml|VERSION)
                MATCH=true; break ;;
            esac
          done <<< "$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          echo "image inputs changed: ${MATCH}"
          echo "image=${MATCH}" >> "$GITHUB_OUTPUT"

  # Five images, one matrix leg each. GitLab needed TEN jobs for this -- five
  # buildkit-build-check plus five trufflehog-image, with the built image
  # shipped between each pair as a tarball through an object-storage bucket.
  # docker-build-check builds and scans in one job, so the bucket, the uploads
  # and the downloads are all gone.
  #
  # NOTE: conditional, so these must never be added to required_status_checks --
  # a required check that skips blocks the merge.
  build:
    name: Build and scan
    needs: changes
    if: needs.changes.outputs.image == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: bot
            dockerfile: docker/Dockerfile
          - image: dispatcher
            dockerfile: docker/Dockerfile.dispatcher
          - image: broker
            dockerfile: docker/Dockerfile.broker
          - image: downloader
            dockerfile: docker/Dockerfile.downloader
          - image: search
            dockerfile: docker/Dockerfile.search
    uses: tnoff/github-workflows/.github/workflows/docker-build-check.yml@362a5f0d06fec04588c60863ccf0bf2ce709917f
    with:
      dockerfile: ${{ matrix.dockerfile }}

  bump-version:
    name: Bump version
    if: startsWith(github.head_ref, 'renovate/dev-')
    permissions:
      contents: write
    uses: tnoff/github-workflows/.github/workflows/bump-version.yml@362a5f0d06fec04588c60863ccf0bf2ce709917f
    with:
      bump_changelog: true
    secrets:
      app_id: ${{ secrets.CI_APP_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  result:
    name: CI result
    # The stable name for the branch ruleset to require.
    #
    # Requiring the individual jobs by name does not gate anything: GitHub
    # scores a `skipped` required check as SUCCESS, and every shared workflow
    # here carries an `allow_fork_prs` gate that can skip its only job.
    #
    # Tox is the sharp case: its matrix legs come from `tox -l` at runtime,
    # so naming `tox (3.13)` couples this ruleset to a file in another repo,
    # and a required check that never reports blocks merging with no failing
    # job to point at.
    #
    # The image build is conditional on `changes`, so it is `skipped` on a
    # PR that touches no image input -- correct, and why skipped passes below.
    # It is also why the build legs must never be required by name: they
    # would pass vacuously.
    #
    # This job always runs and its name never changes, so the ruleset requires
    # exactly one context and the jobs underneath stay free to change.
    if: always()
    needs: [secrets, tox, changes, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Summarise
        run: |
          echo "secrets: ${{ needs.secrets.result }}"
          echo "tox:     ${{ needs.tox.result }}"
          echo "changes: ${{ needs.changes.result }}"
          echo "build:   ${{ needs.build.result }}"

      - name: Fail if any job failed
        # `skipped` is deliberately allowed: with allow_fork_prs false a fork
        # PR skips the cascade, which is the intended outcome, not a failure.
        if: >-
          needs.secrets.result == 'failure' || needs.secrets.result == 'cancelled' ||
          needs.tox.result == 'failure' || needs.tox.result == 'cancelled' ||
          needs.changes.result == 'failure' || needs.changes.result == 'cancelled' ||
          needs.build.result == 'failure' || needs.build.result == 'cancelled'
        run: |
          echo "::error::One or more CI jobs did not pass."
          exit 1
