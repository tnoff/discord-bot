# Backstage catalog descriptor for the whole Discord system.
#
# This is the case the project spec called the modeling stress test: ONE repo
# builds SIX images, deployed as six Deployments in the `discord` namespace and
# released together. A location may hold many documents, so the System, its six
# Components and the database it owns all live here -- and because every entity
# is read from this one location, the derived github.com/project-slug is right
# for all of them without being written once.
#
# The dependsOn edges below were read out of docker-apps apps/discord/config.yaml
# with comment lines stripped, not copied from its README. That matters: the
# README still says discord-db is "live but called by nothing" and that the bot
# and broker hold their own engines until a cutover. They do not. Both point at
# http://discord-db:8085 and only discord.db.conf carries a
# sql_connection_statement, so the cutover has happened and the README is stale.
#
# No annotations, for the reasons the rest of the catalog gives: the slug is
# derived, and techdocs / kubernetes / grafana each assert a target that does not
# exist yet. Worth recording for whoever installs the Kubernetes plugin: unlike
# the two websites, which collide on `app=website` and need new labels, every
# tier here already carries `app: discord` plus a unique `tier:`, so
# `app=discord,tier=<tier>` is unambiguous today.
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: discord
  description: >-
    The Discord bot and the five tiers it was split into. One repo, six images, six
    Deployments in the `discord` namespace, rolled together because they share a build.
spec:
  owner: group:default/admin
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: discord-bot
  description: >-
    Hosts the cog logic -- music, markov, urban, delete_messages. Every Discord API call goes
    to the dispatcher and every other capability is an HTTP call to the tier that holds it,
    with one exception: the music player reads cached media out of object storage directly.
    cogs/music.py passes download.storage.bucket_name into the broker client and
    cogs/music_helpers/music_player.py calls get_file() with the bucket the checkout stamped
    on its result, so this tier holds S3 credentials and a bucket name of its own.
  # Deployment label `tier: runner`
spec:
  type: service
  owner: group:default/admin
  lifecycle: production
  system: discord
  dependsOn:
    - component:default/discord-broker
    - component:default/discord-db
    - component:default/discord-dispatcher
    - component:default/discord-downloader
    - component:default/discord-search
    - resource:default/discord-data-cache-bucket
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: discord-dispatcher
  description: >-
    Owns the Discord REST surface: the other tiers POST to it and it queues the work in
    Redis before calling Discord. One replica with strategy Recreate, because it is the
    single gateway holder and two of it would be two clients.
  # Deployment label `tier: dispatcher`, Service port 8082
spec:
  type: service
  owner: group:default/admin
  lifecycle: production
  system: discord
  dependsOn:
    - resource:default/redis
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: discord-broker
  description: >-
    Media broker. Fronts the download and search tiers for the bot, and reads and writes
    the catalog through discord-db rather than a database engine of its own.
  # Deployment label `tier: broker`, Service port 8081
spec:
  type: service
  owner: group:default/admin
  lifecycle: production
  system: discord
  dependsOn:
    - component:default/discord-db
    - component:default/discord-dispatcher
    - resource:default/discord-data-cache-bucket
    - resource:default/redis
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: discord-downloader
  description: >-
    Consumes the Redis download queue. Runs in-tunnel behind a gluetun WireGuard sidecar
    and picks a different Mullvad exit per download, so downloads are not all attributable
    to one address.
  # Deployment label `tier: downloader`, Service port 8083
spec:
  type: service
  owner: group:default/admin
  lifecycle: production
  system: discord
  dependsOn:
    - component:default/discord-broker
    - resource:default/discord-data-cache-bucket
    - resource:default/redis
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: discord-search
  description: >-
    Consumes the Redis search queue and resolves media metadata. Held at one replica by the
    ytmusic rate limit rather than by any safety concern.
  # Deployment label `tier: search`, Service port 8084
spec:
  type: service
  owner: group:default/admin
  lifecycle: production
  system: discord
  dependsOn:
    - component:default/discord-broker
    - resource:default/redis
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: discord-db
  description: >-
    The only tier that speaks SQL. Serves markov, playlists, guild analytics and the
    video-cache catalog over HTTP, so no other tier needs a database engine in its image.
    One replica, load-bearing: the migration runner is on this entrypoint and two of it
    could race into `alembic upgrade head`.
  # Deployment label `tier: db`, Service port 8085
spec:
  type: service
  owner: group:default/admin
  lifecycle: production
  system: discord
  dependsOn:
    - resource:default/discord-postgres
---
# The nightly backup, declared here rather than in docker-apps where its CronJob
# manifest lives.
#
# The manifest is apps/discord/backup-cronjob.yaml over there, and it runs an
# image built by neither repo (iad.ocir.io/tnoff/database_backup). So no location
# owns this workload outright, and "declare it where the YAML is" would split the
# discord system across two files: the bucket it writes is HERE, and its only
# writer would be somewhere else.
#
# The whole discord system in one descriptor is a property this file claims in its
# own header, and it is the property that made the six-tier model legible. Entities
# sit with the system they belong to; docker-apps' descriptor is the fallback for
# things with no owning system, which is why the monitoring stack lives there and
# backstage-database-backup does not live here.
#
# Known wrinkle, pre-existing rather than new: AnnotateScmSlugEntityProcessor
# derives the slug from the location a file was fetched from, so this Component
# gets github.com/project-slug: tnoff/discord-bot even though its manifest and its
# image come from elsewhere. Already true of discord-postgres, redis and both
# buckets below. Worth knowing before the Kubernetes or GitHub plugins are pointed
# at these.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: discord-database-backup
  description: >-
    Nightly `pg_dump` of discord-pg to object storage, 11:00 UTC, in the `discord`
    namespace. Runs iad.ocir.io/tnoff/database_backup and connects as the `discord.discord`
    role, carrying the `postgres-access: "true"` label the NetworkPolicy requires.
  # Pinned at 233d7e8 while the backstage CronJob on the same image runs c46d8c2.
  # Nothing holds the two together -- worth knowing before assuming a fix in one is
  # live in both.
spec:
  type: service
  owner: group:default/admin
  lifecycle: production
  system: discord
  dependsOn:
    - component:default/database-backup
    - resource:default/discord-database-backups-bucket
    - resource:default/discord-postgres
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: discord-postgres
  description: >-
    The operator-managed `discord-pg` cluster in the `discord-postgres` namespace, reached
    as the `discord.discord` role. Backed up nightly.
spec:
  type: database
  owner: group:default/admin
  system: discord
---
# Redis sits with the discord system, not with docker-apps where its manifests
# live -- the same rule discord-postgres follows. Checked rather than assumed:
# across the whole docker-apps tree the only references to redis-primary are
# apps/discord/config.yaml and apps/discord/downloader-app.yaml, and the
# NetworkPolicy set in the redis namespace is a default deny plus exactly two
# exceptions -- the discord tiers, and a metrics scrape from monitoring. A scrape
# is not a consumer.
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: redis
  description: >-
    Redis at `redis-primary.redis.svc.cluster.local:6379`, used by four of the six tiers.
    Modelled as a queue rather than a cache, and the distinction is load-bearing: it carries
    the download and search work queues, so flushing it or losing a pod mid-pop drops real
    in-flight work rather than a rebuildable cache. Access is per-client NetworkPolicy, and
    a tier with no entry does not fail loudly -- its connect hangs, `/health` never comes up
    and the pod CrashLoops.
spec:
  type: queue
  owner: group:default/admin
  system: discord
---
# The two object-storage buckets, named individually rather than left implicit.
# Transcribed from terraform oci/oci.tf, where they are literals:
#
#   module discord_data_cache  display_name "discord_data_cache"        no expiry
#   module discord_database    display_name "discord_database_backups"  delete_after 14
#
# Both live in the `apps` compartment in us-sanjose-1. That region is worth
# recording: the read-only OCI profile on the workstation is scoped to
# us-ashburn-1, so these buckets 404 from there and the 404 looks exactly like
# the bucket being gone. Contents are an operator measurement, not an inference
# from an error code.
#
# There is deliberately NO entity for the `dev_discord_data` bucket. It is
# development scaffolding with its own push bot and no deployed consumer in this
# cluster, and the catalog is for what runs.
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: discord-data-cache-bucket
  description: >-
    The video cache: media objects checked out by the broker and replayed by the bot without
    re-downloading. No lifecycle expiry, so it grows until something removes an object -- and
    what is stored is the SIZED DOWNLOAD rather than decoded PCM, which is why measured
    usage has run far over a cap set as though it were audio frames. discord-db owns the
    CATALOG of what is in here; the objects themselves are this bucket.
spec:
  type: object-storage
  owner: group:default/admin
  system: discord
---
# Written by discord-database-backup above -- declared in this same file, which is
# the point of putting it here rather than in docker-apps. The Resource and its
# only writer are one edge in one location.
#
# What would NOT be right is an edge from discord-postgres: that would claim the
# database needs its own backups in order to run.
#
# (Two earlier drafts of this comment were wrong and are worth not repeating. The
# first called database-backup a `library` that owns no workload when it was
# spec.type: service -- it is `library` now, but only since database-backup#226,
# and the reasoning was backwards either way. The second said this Resource had to
# stay a leaf until docker-apps declared the CronJob. Neither the type nor the
# location was settled at the time each was written.)
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: discord-database-backups-bucket
  description: >-
    Nightly `pg_dump` of the `discord-pg` cluster, written by the discord-database-backup
    CronJob. Objects are deleted after 14 days, so it holds two weeks of dumps and nothing
    older.
spec:
  type: object-storage
  owner: group:default/admin
  system: discord
