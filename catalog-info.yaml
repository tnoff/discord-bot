# Backstage catalog descriptor for the whole Discord system.
#
# This is the case the project spec called the modeling stress test: ONE repo
# builds SIX images, deployed as six Deployments in the `discord` namespace and
# released together. A location may hold many documents, so the six Components and
# the database they use live here (the System itself is declared in tnoff/docker-apps,
# next to the manifests that define it, and these reach it through spec.system) -- and because every entity
# is read from this one location, the derived github.com/project-slug is right
# for all of them without being written once.
#
# The dependsOn edges below were read out of docker-apps apps/discord/config.yaml
# with comment lines stripped, not copied from its README. That matters: the
# README still says discord-db is "live but called by nothing" and that the bot
# and broker hold their own engines until a cutover. They do not. Both point at
# http://discord-db:8085 and only discord.db.conf carries a
# sql_connection_statement, so the cutover has happened and the README is stale.
#
# No annotations, for the reasons the rest of the catalog gives: the slug is
# derived, and techdocs / kubernetes / grafana each assert a target that does not
# exist yet. Worth recording for whoever installs the Kubernetes plugin: unlike
# the two websites, which collide on `app=website` and need new labels, every
# tier here already carries `app: discord` plus a unique `tier:`, so
# `app=discord,tier=<tier>` is unambiguous today.
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: discord-bot
  description: >-
    Hosts the cog logic -- music, markov, urban, delete_messages. Every Discord API call goes
    to the dispatcher and every other capability is an HTTP call to the tier that holds it,
    with one exception: the music player reads cached media out of object storage directly.
    cogs/music.py passes download.storage.bucket_name into the broker client and
    cogs/music_helpers/music_player.py calls get_file() with the bucket the checkout stamped
    on its result, so this tier holds S3 credentials and a bucket name of its own.
  # Deployment label `tier: runner`
spec:
  type: service
  owner: group:default/admin
  lifecycle: production
  system: discord
  dependsOn:
    - component:default/discord-broker
    - component:default/discord-db
    - component:default/discord-dispatcher
    - component:default/discord-downloader
    - component:default/discord-search
    - resource:default/discord-data-cache-bucket
  consumesApis:
    - api:default/broker
    - api:default/database
    - api:default/dispatch
    - api:default/media-search
    - api:default/queue-worker-downloads
    - api:default/queue-worker-ytmusic

---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: discord-dispatcher
  description: >-
    Owns the Discord REST surface: the other tiers POST to it and it queues the work in
    Redis before calling Discord. One replica with strategy Recreate, because it is the
    single gateway holder and two of it would be two clients.
  # Deployment label `tier: dispatcher`, Service port 8082
spec:
  type: service
  owner: group:default/admin
  lifecycle: production
  system: discord
  dependsOn:
    - resource:default/redis
  providesApis:
    - api:default/dispatch

---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: discord-broker
  description: >-
    Media broker. Fronts the download and search tiers for the bot, and reads and writes
    the catalog through discord-db rather than a database engine of its own.
  # Deployment label `tier: broker`, Service port 8081
spec:
  type: service
  owner: group:default/admin
  lifecycle: production
  system: discord
  dependsOn:
    - component:default/discord-db
    - component:default/discord-dispatcher
    - resource:default/discord-data-cache-bucket
    - resource:default/redis
  providesApis:
    - api:default/broker
  consumesApis:
    - api:default/database
    - api:default/dispatch

---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: discord-downloader
  description: >-
    Consumes the Redis download queue. Runs in-tunnel behind a gluetun WireGuard sidecar
    and picks a different Mullvad exit per download, so downloads are not all attributable
    to one address.
  # Deployment label `tier: downloader`, Service port 8083
spec:
  type: service
  owner: group:default/admin
  lifecycle: production
  system: discord
  dependsOn:
    - component:default/discord-broker
    - resource:default/discord-data-cache-bucket
    - resource:default/redis
  providesApis:
    - api:default/queue-worker-downloads
  consumesApis:
    - api:default/broker

---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: discord-search
  description: >-
    Consumes the Redis search queue and resolves media metadata. Held at one replica by the
    ytmusic rate limit rather than by any safety concern.
  # Deployment label `tier: search`, Service port 8084
spec:
  type: service
  owner: group:default/admin
  lifecycle: production
  system: discord
  dependsOn:
    - component:default/discord-broker
    - resource:default/redis
  providesApis:
    - api:default/media-search
    - api:default/queue-worker-ytmusic
  consumesApis:
    - api:default/broker

---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: discord-db
  description: >-
    The only tier that speaks SQL. Serves markov, playlists, guild analytics and the
    video-cache catalog over HTTP, so no other tier needs a database engine in its image.
    One replica, load-bearing: the migration runner is on this entrypoint and two of it
    could race into `alembic upgrade head`.
  # Deployment label `tier: db`, Service port 8085
spec:
  type: service
  owner: group:default/admin
  lifecycle: production
  system: discord
  dependsOn:
    - resource:default/discord-postgres
  providesApis:
    - api:default/database

---
# The nightly backup, declared here rather than in docker-apps where its CronJob
# manifest lives.
#
# The manifest is apps/discord/backup-cronjob.yaml over there, and it runs an
# image built by neither repo (iad.ocir.io/tnoff/database_backup). The datastores
# it reads and writes (discord-postgres, discord-database-backups-bucket) are now
# declared in docker-apps with the rest of the discord System's infrastructure;
# this Component is left here for now and could follow them.
#
# Known wrinkle, pre-existing rather than new: AnnotateScmSlugEntityProcessor
# derives the slug from the location a file was fetched from, so this Component
# gets github.com/project-slug: tnoff/discord-bot even though its manifest and its
# image come from elsewhere. Was also true of the discord datastore Resources,
# before they moved to docker-apps. Worth knowing before the Kubernetes or GitHub plugins are pointed
# at these.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: discord-database-backup
  description: >-
    Nightly `pg_dump` of discord-pg to object storage, 11:00 UTC, in the `discord`
    namespace. Runs iad.ocir.io/tnoff/database_backup and connects as the `discord.discord`
    role, carrying the `postgres-access: "true"` label the NetworkPolicy requires.
  # Pinned at 233d7e8 while the backstage CronJob on the same image runs c46d8c2.
  # Nothing holds the two together -- worth knowing before assuming a fix in one is
  # live in both.
spec:
  type: service
  owner: group:default/admin
  lifecycle: production
  system: discord
  dependsOn:
    - component:default/database-backup
    - resource:default/discord-database-backups-bucket
    - resource:default/discord-postgres
---
# The six API entities, one per SERVED SURFACE, and the OpenAPI documents behind
# them are generated -- tests/routes/test_openapi_docs.py reads each server's
# built aiohttp router, the same source GET /_contract/routes reads. A pod and
# its published API description therefore cannot disagree about which routes
# exist.
#
# Six entities for five seams. `queue_worker` is a route shape rather than a pod:
# the downloader serves it at /downloads and the search pod at /search/ytmusic,
# with disjoint route sets, so one entity per seam would describe two pods as one
# and be accurate for neither. discord-search consequently provides two of these.
#
# `definition` is a $text reference rather than an inlined document, so the spec
# lives in one place and a route addition shows up as a diff in docs/openapi/
# rather than a re-indented wall inside this file.
#
# The documents carry routes and no body schemas, deliberately. See
# docs/projects/http-seam-contract.md -- the seam contract guarantees which
# routes exist; the bodies are typed four different ways across the seams and
# describing them here would be a third representation with nothing to keep it
# honest.
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: broker
  description: >-
    The `broker` seam as served by discord-broker -- 22 routes across 20 paths.
    Generated from the built router; do not hand-edit docs/openapi/broker.yaml.
spec:
  type: openapi
  owner: group:default/admin
  lifecycle: production
  system: discord
  definition:
    $text: ./docs/openapi/broker.yaml
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: database
  description: >-
    The `database` seam as served by discord-db -- 33 routes across 33 paths.
    Generated from the built router; do not hand-edit docs/openapi/database.yaml.
spec:
  type: openapi
  owner: group:default/admin
  lifecycle: production
  system: discord
  definition:
    $text: ./docs/openapi/database.yaml
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: dispatch
  description: >-
    The `dispatch` seam as served by discord-dispatcher -- 8 routes across 8 paths.
    Generated from the built router; do not hand-edit docs/openapi/dispatch.yaml.
spec:
  type: openapi
  owner: group:default/admin
  lifecycle: production
  system: discord
  definition:
    $text: ./docs/openapi/dispatch.yaml
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: media-search
  description: >-
    The `media_search` seam as served by discord-search -- 2 routes across 2 paths.
    Generated from the built router; do not hand-edit docs/openapi/media-search.yaml.
spec:
  type: openapi
  owner: group:default/admin
  lifecycle: production
  system: discord
  definition:
    $text: ./docs/openapi/media-search.yaml
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: queue-worker-downloads
  description: >-
    The `queue_worker` seam as served by discord-downloader at `/downloads` -- 4 routes across 4 paths.
    Generated from the built router; do not hand-edit docs/openapi/queue-worker-downloads.yaml.
spec:
  type: openapi
  owner: group:default/admin
  lifecycle: production
  system: discord
  definition:
    $text: ./docs/openapi/queue-worker-downloads.yaml
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: queue-worker-ytmusic
  description: >-
    The `queue_worker` seam as served by discord-search at `/ytmusic` -- 4 routes across 4 paths.
    Generated from the built router; do not hand-edit docs/openapi/queue-worker-ytmusic.yaml.
spec:
  type: openapi
  owner: group:default/admin
  lifecycle: production
  system: discord
  definition:
    $text: ./docs/openapi/queue-worker-ytmusic.yaml
