components:
  schemas:
    BumpQueuedTrackResponse:
      description: '`bumped` is False when the track was not queued; `download` is the track moved.'
      properties:
        bumped:
          title: Bumped
          type: boolean
        download:
          anyOf:
          - $ref: '#/components/schemas/QueuedDownload'
          - type: 'null'
          default: null
      required:
      - bumped
      title: BumpQueuedTrackResponse
      type: object
    CacheCleanupResponse:
      description: Whether the cleanup pass removed anything.
      properties:
        removed:
          title: Removed
          type: boolean
      required:
      - removed
      title: CacheCleanupResponse
      type: object
    CachedDownload:
      description: 'The download record carried with a cache hit.


        `request` stays a `dict` rather than a nested `MediaRequest`: the handler

        builds it with `model_dump(mode=''json'')`, and re-parsing it into the model

        only to dump it again risks the datetime class of bug that bit the dispatch

        seam, where a plain `model_dump()` returns objects `json_response` cannot

        serialise.'
      properties:
        request:
          additionalProperties: true
          title: Request
          type: object
        file_path:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: File Path
        file_size_bytes:
          default: null
          title: File Size Bytes
        cache_hit:
          default: null
          title: Cache Hit
        ytdl_data:
          $ref: '#/components/schemas/CachedYtdlData'
      required:
      - request
      - ytdl_data
      title: CachedDownload
      type: object
    CachedYtdlData:
      description: The yt-dlp metadata carried with a cache hit.
      properties:
        id:
          default: null
          title: Id
        title:
          default: null
          title: Title
        webpage_url:
          default: null
          title: Webpage Url
        uploader:
          default: null
          title: Uploader
        duration:
          default: null
          title: Duration
        extractor:
          default: null
          title: Extractor
      title: CachedYtdlData
      type: object
    CheckCacheHitResponse:
      description: Cache hit, with the cached download record.
      properties:
        hit:
          const: true
          default: true
          title: Hit
          type: boolean
        download:
          $ref: '#/components/schemas/CachedDownload'
      required:
      - download
      title: CheckCacheHitResponse
      type: object
    CheckCacheMissResponse:
      description: Cache miss. `hit` is the discriminator the client branches on.
      properties:
        hit:
          const: false
          default: false
          title: Hit
          type: boolean
      title: CheckCacheMissResponse
      type: object
    CheckoutBody:
      description: POST /requests/{uuid}/checkout
      properties:
        guild_id:
          title: Guild Id
          type: integer
      required:
      - guild_id
      title: CheckoutBody
      type: object
    CheckoutEmptyResponse:
      description: 'Checkout found nothing to hand out (unknown entry, or no download attached).


        Two models for one route, because the two answers are different BYTES, not

        one body with optional fields: a hit sends `{''s3_key'': ...}` and a miss sends

        `{}`. (Brokers from before local staging was removed sent

        `{''guild_file_path'': null}` for a miss; the extra key is ignored on read.)'
      properties: {}
      title: CheckoutEmptyResponse
      type: object
    CheckoutS3Response:
      description: 'Checkout answered by an HA broker: the file is in S3, caller fetches it.


        `bucket_name` is deliberately absent. The client fills it from its own

        config, because the bot already knows which bucket it is configured against

        and the broker telling it would be a second source for one fact.'
      properties:
        s3_key:
          title: S3 Key
          type: string
      required:
      - s3_key
      title: CheckoutS3Response
      type: object
    ClaimBody:
      description: POST /guilds/{guild_id}/claim
      properties:
        gateway_id:
          title: Gateway Id
          type: string
      required:
      - gateway_id
      title: ClaimBody
      type: object
    ClaimIntentsResponse:
      description: 'Intents leased to the claiming gateway, in the order they were submitted.


        Answered 204 with no body when there are none, so an idle poll is an empty response.'
      properties:
        intents:
          items:
            $ref: '#/components/schemas/IntentBody'
          title: Intents
          type: array
      required:
      - intents
      title: ClaimIntentsResponse
      type: object
    ClaimTrackHitResponse:
      description: 'A track claimed and marked as playing.


        `bucket_name` is absent for the same reason it is from `CheckoutS3Response`: the client

        already knows which bucket it is configured against.'
      properties:
        claimed:
          const: true
          default: true
          title: Claimed
          type: boolean
        download:
