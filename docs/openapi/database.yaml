components:
  schemas:
    AddItemsBody:
      description: playlist/add_items
      properties:
        playlist_id:
          title: Playlist Id
          type: integer
        items:
          items:
            $ref: '#/components/schemas/PlaylistItemWrite'
          title: Items
          type: array
        max_size:
          title: Max Size
          type: integer
      required:
      - playlist_id
      - items
      - max_size
      title: AddItemsBody
      type: object
    CachedDownload:
      description: 'The download record carried with a cache hit.


        `request` stays a `dict` rather than a nested `MediaRequest`: the handler

        builds it with `model_dump(mode=''json'')`, and re-parsing it into the model

        only to dump it again risks the datetime class of bug that bit the dispatch

        seam, where a plain `model_dump()` returns objects `json_response` cannot

        serialise.'
      properties:
        request:
          additionalProperties: true
          title: Request
          type: object
        file_path:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: File Path
        file_size_bytes:
          default: null
          title: File Size Bytes
        cache_hit:
          default: null
          title: Cache Hit
        ytdl_data:
          $ref: '#/components/schemas/CachedYtdlData'
      required:
      - request
      - ytdl_data
      title: CachedDownload
      type: object
    CachedYtdlData:
      description: The yt-dlp metadata carried with a cache hit.
      properties:
        id:
          default: null
          title: Id
        title:
          default: null
          title: Title
        webpage_url:
          default: null
          title: Webpage Url
        uploader:
          default: null
          title: Uploader
        duration:
          default: null
          title: Duration
        extractor:
          default: null
          title: Extractor
      title: CachedYtdlData
      type: object
    DatabaseErrorBody:
      description: A persistence-tier failure, flattened for the wire.
      properties:
        detail:
          title: Detail
          type: string
      required:
      - detail
      title: DatabaseErrorBody
      type: object
    GenerateWordsBody:
      description: 'markov/generate_words. `first_word` is optional: `!markov speak` with no seed sends
        null.'
      properties:
        guild_id:
          title: Guild Id
          type: integer
        count:
          title: Count
          type: integer
        first_word:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: First Word
      required:
      - guild_id
      - count
      title: GenerateWordsBody
      type: object
    GuildAnalyticsEntry:
      description: One guild's play totals, detached from any DB session.
      properties:
        total_plays:
          title: Total Plays
          type: integer
        cached_plays:
          title: Cached Plays
          type: integer
        total_duration_days:
          title: Total Duration Days
          type: integer
        total_duration_seconds:
          title: Total Duration Seconds
          type: integer
        created_at:
