[tox]
min_version = 4.0
env_list =
    py311
    py312
    py313
    py314

[testenv]
# All seven packages, path-installed, not just discord_gateway's. The suite
# exercises all six tiers -- it drives the in-process download worker and the
# search worker as test doubles, so it needs the downloader's and search
# pod's dependencies even though the bot image no longer ships them.
#
# This is why [bot] narrowing broke CI once, back when this was one extra per
# image on a single pyproject.toml: tox installed bot,search,test, and when
# yt-dlp left [bot] the suite could not import conftest. Criterion 8 step 5
# replaced the per-image extras with one real pyproject.toml per package, so
# there is no longer a capability group to enumerate here -- only the seven
# install targets, one per package directory. Missing one now fails at
# collection (an ImportError for whatever only that package declares) rather
# than passing quietly, which is what happened to [db] under the old extras
# list: harmless only because it was a strict subset of [bot], for as long as
# it stayed one.
extras = test
deps =
    -e ./discord_core
    -e ./discord_gateway
    -e ./discord_broker
    -e ./discord_db
    -e ./discord_dispatcher
    -e ./discord_downloader
    -e ./discord_search
passenv =
    POSTGRES_TEST_HOST
    POSTGRES_TEST_PORT
    POSTGRES_TEST_USER
    POSTGRES_TEST_PASSWORD
setenv =
    POSTGRES_TEST_HOST = {env:POSTGRES_TEST_HOST:localhost}
    POSTGRES_TEST_PORT = {env:POSTGRES_TEST_PORT:5432}
    POSTGRES_TEST_USER = {env:POSTGRES_TEST_USER:postgres}
    POSTGRES_TEST_PASSWORD = {env:POSTGRES_TEST_PASSWORD:postgres}
allowlist_externals =
    sh
commands_pre =
    sh tests/start_postgres_for_ci.sh
commands =
    # --ignore=tests: criterion 8 step 5 nested each package's own test tree at
    # discord_core/tests/, discord_gateway/tests/, etc. -- a real, importable
    # package (__init__.py throughout, same convention the old central tests/
    # used), so a plain scan of discord_core/ finds it as readily as any
    # production module. Verified empirically before adding this flag: without
    # it, pylint here scored 9.64/10 on discord_core/ alone, docked entirely by
    # duplicate-code findings BETWEEN test files, checked under the wrong
    # rcfile. `--ignore` matches by basename recursively, so this also covers
    # any future package's tests/ without listing seven paths by hand.
    py314: pylint --ignore=tests discord_core/ discord_dispatcher/ discord_downloader/ discord_broker/ discord_search/ discord_db/ discord_gateway/
    # All eight test locations: the central tests/ (boundary and cross-package
    # checks) plus each package's own tests/, mirroring the source layout as
    # of the same step.
    py314: pylint --rcfile .pylintrc.test tests/ discord_core/tests/ discord_gateway/tests/ discord_broker/tests/ discord_db/tests/ discord_dispatcher/tests/ discord_downloader/tests/ discord_search/tests/
    # --exclude, not --ignore: bandit's flag takes paths, not basenames, so
    # each package's own tests/ is named explicitly. Verified empirically the
    # same way as pylint's --ignore above: without this, bandit found 755 Low
    # and 1 High issue, entirely inside the seven tests/ subtrees and none of
    # it new -- bandit has never scanned test code, since it lived outside
    # these directories entirely before this split.
    py314: bandit -r discord_core/ discord_dispatcher/ discord_downloader/ discord_broker/ discord_search/ discord_db/ discord_gateway/ --exclude discord_core/tests,discord_dispatcher/tests,discord_downloader/tests,discord_broker/tests,discord_search/tests,discord_db/tests,discord_gateway/tests
    # Bare `--cov`, and no path argument either: the source root lives in
    # pyproject's [tool.coverage.run], which is repo-rooted, so neither this
    # cannot fall behind a new package the way an enumerated list does.
    # Passing `tests/` here was itself an enumerated list of one -- it
    # silently stopped collecting the other 105 test files the moment
    # criterion 8 step 5 nested most of them under discord_core/tests/,
    # discord_gateway/tests/, etc.: pytest treats a path argument as the
    # collection root, not a hint, and `python_files = ["tests/*.py"]` in
    # pyproject only filters WHICH files count as tests once something finds
    # them. Bare `pytest` uses the rootdir default (the whole repo) and lets
    # that filter do its job everywhere at once. pylint and bandit still
    # enumerate, because pointing either at `.` would pull in .venv/.
    pytest --cov --cov-report=xml --cov-fail-under=99
