[tox]
min_version = 4.0
env_list =
    py311
    py312
    py313
    py314

[testenv]
# The six pods, path-installed, not just discord_gateway's. The suite
# exercises all six tiers -- it drives the in-process download worker and the
# search worker as test doubles, so it needs the downloader's and search
# pod's dependencies even though the bot image no longer ships them.
#
# This is why [bot] narrowing broke CI once, back when this was one extra per
# image on a single pyproject.toml: tox installed bot,search,test, and when
# yt-dlp left [bot] the suite could not import conftest. Criterion 8 step 5
# replaced the per-image extras with one real pyproject.toml per package, so
# there is no longer a capability group to enumerate here -- only the six
# install targets, one per pod directory. Missing one now fails at collection
# (an ImportError for whatever only that package declares) rather than
# passing quietly, which is what happened to [db] under the old extras list:
# harmless only because it was a strict subset of [bot], for as long as it
# stayed one.
#
# discord_core is deliberately NOT listed here any more -- criterion 8 step 7.
# Each of the six pods above now declares a real
# `discord-core @ https://.../archive/refs/tags/core-vX.Y.Z.tar.gz#subdirectory=discord_core`
# dependency in its own pyproject.toml (tests/cli/test_package_pins.py
# enforces that all six agree on the exact same tag), the same shape
# `dappertable` already used. Installing an EDITABLE local `-e ./discord_core`
# alongside that in the same `pip install` invocation is not just redundant,
# it is IMPOSSIBLE: pip's resolver sees two different sources claiming to
# satisfy the same project name (an explicit local editable vs. a pinned
# URL some other requirement in the same resolve declares) and refuses with
# `ResolutionImpossible`. Verified empirically with a throwaway two-package
# repro before writing this comment: `pip install -e ./pkg_a -e ./pkg_b`,
# where `pkg_b` depends on `pkg-a @ file://...`, fails the exact same way.
#
# Dropping discord_core from `deps` is also what makes this list
# conflict-free: all six pods pin the IDENTICAL tag, so resolving their
# six declared dependencies in one pip invocation installs discord_core
# exactly once, from that tag -- verified the same way, with a second
# throwaway repro (two packages pinning the same URL, installed together).
#
# The consequence, accepted when this was designed: a PR that edits
# discord_core cannot have that edit exercised by the pods' own test run in
# the SAME tox invocation -- the pods always resolve the last RELEASED
# discord_core tag, never this checkout, until core's tag is cut and every
# pod's pin is bumped to it in a follow-up PR (now enforced, together, by
# test_package_pins.py). discord_core's OWN edits are still tested, against
# THIS checkout -- see the core-alone pytest pass in `commands` below, which
# is also where `-e ./discord_core` now lives instead.
extras = test
deps =
    -e ./discord_gateway
    -e ./discord_broker
    -e ./discord_db
    -e ./discord_dispatcher
    -e ./discord_downloader
    -e ./discord_search
passenv =
    POSTGRES_TEST_HOST
    POSTGRES_TEST_PORT
    POSTGRES_TEST_USER
    POSTGRES_TEST_PASSWORD
setenv =
    POSTGRES_TEST_HOST = {env:POSTGRES_TEST_HOST:localhost}
    POSTGRES_TEST_PORT = {env:POSTGRES_TEST_PORT:5432}
    POSTGRES_TEST_USER = {env:POSTGRES_TEST_USER:postgres}
    POSTGRES_TEST_PASSWORD = {env:POSTGRES_TEST_PASSWORD:postgres}
allowlist_externals =
    sh
commands_pre =
    sh tests/start_postgres_for_ci.sh
commands =
    # --ignore=tests: criterion 8 step 5 nested each package's own test tree at
    # discord_core/tests/, discord_gateway/tests/, etc. -- a real, importable
    # package (__init__.py throughout, same convention the old central tests/
    # used), so a plain scan of discord_core/ finds it as readily as any
    # production module. Verified empirically before adding this flag: without
    # it, pylint here scored 9.64/10 on discord_core/ alone, docked entirely by
    # duplicate-code findings BETWEEN test files, checked under the wrong
    # rcfile. `--ignore` matches by basename recursively, so this also covers
    # any future package's tests/ without listing seven paths by hand.
    py314: pylint --ignore=tests discord_core/ discord_dispatcher/ discord_downloader/ discord_broker/ discord_search/ discord_db/ discord_gateway/
    # All eight test locations: the central tests/ (boundary and cross-package
    # checks) plus each package's own tests/, mirroring the source layout as
    # of the same step.
    py314: pylint --rcfile .pylintrc.test tests/ discord_core/tests/ discord_gateway/tests/ discord_broker/tests/ discord_db/tests/ discord_dispatcher/tests/ discord_downloader/tests/ discord_search/tests/
    # --exclude, not --ignore: bandit's flag takes paths, not basenames, so
    # each package's own tests/ is named explicitly. Verified empirically the
    # same way as pylint's --ignore above: without this, bandit found 755 Low
    # and 1 High issue, entirely inside the seven tests/ subtrees and none of
    # it new -- bandit has never scanned test code, since it lived outside
    # these directories entirely before this split.
    py314: bandit -r discord_core/ discord_dispatcher/ discord_downloader/ discord_broker/ discord_search/ discord_db/ discord_gateway/ --exclude discord_core/tests,discord_dispatcher/tests,discord_downloader/tests,discord_broker/tests,discord_search/tests,discord_db/tests,discord_gateway/tests
    # Both pylint lines and bandit above stay exactly as they were before
    # criterion 8 step 7's pytest split, scanning all seven package trees (the
    # six pods plus discord_core) TOGETHER, in one pass each. They have none of
    # pytest's problem: pylint and bandit are static analysers reading files
    # off disk, not importing the packages under test, so which discord_core
    # install happens to be active in the venv when they run (the pods' pinned
    # tag, this checkout's editable override, or neither yet) makes no
    # difference to what they find -- there is only ever one discord_core/ on
    # disk, this checkout's, regardless. Splitting them the way the two pytest
    # passes below are split would buy nothing and cost a second rcfile lookup
    # and a second report to reconcile.
    #
    # Bare `--cov`, and no path argument either: the source root lives in
    # pyproject's [tool.coverage.run], which is repo-rooted, so neither this
    # cannot fall behind a new package the way an enumerated list does.
    # Passing `tests/` here was itself an enumerated list of one -- it
    # silently stopped collecting the other 105 test files the moment
    # criterion 8 step 5 nested most of them under discord_core/tests/,
    # discord_gateway/tests/, etc.: pytest treats a path argument as the
    # collection root, not a hint, and `python_files = ["tests/*.py"]` in
    # pyproject only filters WHICH files count as tests once something finds
    # them. Bare `pytest` uses the rootdir default (the whole repo) and lets
    # that filter do its job everywhere at once. pylint and bandit still
    # enumerate, because pointing either at `.` would pull in .venv/.
    #
    # Two pytest passes now, not one -- criterion 8 step 7's other half. The
    # README-style framing is: "discord_core is tested alone, the six pods are
    # tested together." A literal second *tox environment* would be the more
    # obvious way to spell that, and was the first thing tried here -- it does
    # not work. ci.yml's `tox:` job calls a SHARED reusable workflow
    # (tnoff/github-workflows/.github/workflows/tox.yml), whose `discover` job
    # finds environments by running `tox -l` and keeping only names that
    # `fullmatch` the regex `py(\d)(\d+)` -- i.e. literally `py311`, `py312`,
    # ... and nothing else, prefixed or suffixed. Its `tox` job then runs
    # EXACTLY `tox -e "py${PY//./}"` per discovered version: one named
    # environment per Python version, full stop. A second environment named
    # anything else (`core`, `core-py311`, ...) would neither be discovered
    # (the regex would reject it) nor invoked (the hardcoded `-e py<version>`
    # never names it) -- it would silently never run in CI. Confirmed by
    # reading that workflow's actual source rather than assumed. So the four
    # `pyXYZ` environments stay the ONLY ones, and the split happens inside
    # each one's `commands` instead, via two sequential pytest invocations in
    # the same venv -- which also means the "same four Python versions" the
    # task asks for falls out for free, with no new matrix to keep in sync.
    #
    # Pass 1 -- the six pods, together, against discord_core as the pods'
    # OWN pin resolves it (the tagged release, installed above as part of
    # `deps`) -- NOT this checkout. Excludes discord_core/tests: those run in
    # pass 2 below, against a DIFFERENT discord_core install (this checkout,
    # editable), so running them here would just be measuring the same files
    # twice against whichever install happened to be active, which is exactly
    # the ambiguity splitting these two passes is meant to remove.
    # `--cov-report=` (no report, no fail-under yet): this pass only writes
    # coverage DATA; the combined, enforced total is computed once, after
    # pass 2.
    pytest --ignore=discord_core/tests --cov --cov-report=
    # Pass 2 -- discord_core alone, against THIS checkout, editable. Installed
    # here rather than in `deps` for the ResolutionImpossible reason explained
    # above; no `--no-deps`, deliberately -- a PR that bumps one of
    # discord_core's own third-party pins should have that take effect for
    # this pass, not silently keep whatever the tagged release's pyproject.toml
    # happened to declare pass 1 installed. Collects discord_core/tests ONLY
    # (a path argument, unlike pass 1's bare target -- see the note on bare
    # `pytest` above; here narrowing the collection root to exactly this one
    # package's tests is the intent, not a problem to avoid).
    # `--cov-append` folds this pass's data into pass 1's, so the two together
    # are ONE coverage measurement, not two separately-gated ones: a line in
    # discord_core covered only incidentally, by something a pod's own test
    # exercises through it, and a line covered only by discord_core's own
    # suite, both count toward the SAME combined total below. `--cov-fail-under`
    # only appears on this, the LAST pytest invocation of the env, for the same
    # reason it only ever appeared once before this split -- a threshold
    # checked mid-sequence, before the data is complete, would be checking the
    # wrong number.
    pip install -e ./discord_core
    pytest discord_core/tests --cov --cov-append --cov-report=xml --cov-fail-under=99
