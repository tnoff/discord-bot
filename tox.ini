[tox]
min_version = 4.0
env_list =
    py311
    py312
    py313
    py314

[testenv]
# Every image extra, not just [bot]. The suite exercises all six tiers -- it
# drives the in-process download worker and the search worker as test doubles,
# so it needs the downloader's and search pod's dependencies even though the bot
# image no longer ships them. Installing the image extras rather than naming
# packages means a new capability group is picked up here automatically.
#
# This is why [bot] narrowing broke CI once: tox installed bot,search,test, and
# when yt-dlp left [bot] the suite could not import conftest.
#
# [db] was missing here from the MR that introduced it. Harmless so far only
# because it is a strict subset of [bot] -- the first dependency unique to the
# db image would have gone untested. That is exactly the automatic pickup this
# list is supposed to provide.
extras = bot,dispatcher,broker,downloader,search,db,test
passenv =
    POSTGRES_TEST_HOST
    POSTGRES_TEST_PORT
    POSTGRES_TEST_USER
    POSTGRES_TEST_PASSWORD
setenv =
    POSTGRES_TEST_HOST = {env:POSTGRES_TEST_HOST:localhost}
    POSTGRES_TEST_PORT = {env:POSTGRES_TEST_PORT:5432}
    POSTGRES_TEST_USER = {env:POSTGRES_TEST_USER:postgres}
    POSTGRES_TEST_PASSWORD = {env:POSTGRES_TEST_PASSWORD:postgres}
allowlist_externals =
    sh
commands_pre =
    sh tests/start_postgres_for_ci.sh
commands =
    py314: pylint discord_bot/
    py314: pylint --rcfile .pylintrc.test  tests/
    py314: bandit -r discord_bot/
    pytest --cov=discord_bot --cov-report=xml --cov-fail-under=99 tests/
