[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-dispatcher"
dynamic = ["version"]
description = "discord-bot: sends and edits real Discord messages on the other five pods' behalf"
authors = [
    {name = "Tyler D. North", email = "me@tyler-north.com"},
]
requires-python = ">=3.11"
# discord.py is here on its own merits, not by accident: workers/message_dispatcher
# imports Message, Bot and NotFound at runtime. No voice -- the dispatcher
# never joins a voice channel, which is why it does not also carry PyNaCl/davey.
dependencies = [
    # discord_core, pinned to a real released tag rather than the local
    # checkout path -- criterion 8 step 7. All six pods pin the IDENTICAL tag
    # string; tests/cli/test_package_pins.py enforces that they never drift
    # apart.
    "discord-core @ https://github.com/tnoff/discord-bot/archive/refs/tags/core-v3.0.5.tar.gz#subdirectory=discord_core",
    "discord.py==2.7.1",
]

[project.scripts]
discord-dispatcher = "discord_dispatcher.cli.dispatcher:main"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
where = [".."]
include = ["discord_dispatcher", "discord_dispatcher.*"]
# Excluded, not just left unmentioned: discord_dispatcher/tests/ is a real,
# discoverable package (it has __init__.py throughout, the same
# convention the old central tests/ used), so the include globs above
# would otherwise sweep it into this distribution. Verified empirically
# -- discord_dispatcher.tests, discord_dispatcher.tests.cli, etc. showed up in a real
# PackageFinder.find() call before this exclude was added.
exclude = ["discord_dispatcher.tests", "discord_dispatcher.tests.*"]
