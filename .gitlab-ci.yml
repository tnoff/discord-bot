default:
  # Ride out ci-pool cold-starts / node churn (warm ci floor + autoscaler
  # scale-down grace live in terraform nodes_v2_ci and docker-apps
  # cluster-autoscaler). These `when:` classes are infra-side failures, never
  # `script_failure`, so a failing test/lint is never silently retried. GitLab
  # caps retry:max at 2 (= 3 total attempts).
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure
  tags:
    - self-hosted

stages:
  - pr-check
  - test
  - push
  - notify
  - renovate

# Shared rules for the image build-check + trufflehog image-scan jobs. These
# are a pre-merge gate: they verify the image builds and scan it for secrets.
# MR-only by design — on the default branch they add nothing, because
# push:image-* builds and publishes the image independently (needs: []), so
# re-building it in pr-check just to scan it duplicates the push's build and
# burns runner slots (and the scan already ran on the MR). On MRs that don't
# touch anything baked into the image (the docker/ context, python source,
# deps, or version), skip them too. Fork MRs keep the manual gate.
.image-build-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID != $CI_PROJECT_ID
      when: manual
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - discord_bot/**/*
        - alembic/**/*
        - alembic.ini
        - docker/**/*
        - pyproject.toml
        - VERSION

bump-version:
  extends: .bump-version
  variables:
    GITLAB_PUSH_TOKEN: $RENOVATE_TOKEN
    # Writes a per-MR changelog.d/<slug>.md fragment (conflict-free); folded at
    # release by assemble-changelog.
    BUMP_CHANGELOG: 'true'
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^renovate\/dev-/

# Heavy-repo guard: the assemble fold pushes a "docs: assemble changelog for X"
# commit -> follow-up pipeline. Exclude that commit from the image-push +
# trigger-bump jobs so the follow-up only re-tags (a byte-identical rebuild would
# skip the tag write and trigger-bump would pin a non-existent tag -> phantom pin).
.not-on-changelog-fold:
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /^docs: assemble changelog/'
      when: never

# Folds accumulated changelog.d/*.md fragments into CHANGELOG.md on the default
# branch at release, deletes them, pushes back (idempotent). GATE_ON_FRAGMENTS on
# push:tag defers tagging to the drained follow-up pipeline.
"assemble-changelog":
  extends: .assemble-changelog
  stage: .pre
  variables:
    GITLAB_PUSH_TOKEN: $RENOVATE_TOKEN
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"

"pr-check:secrets":
  extends: .trufflehog
  stage: pr-check
  rules:
    # Fork MRs require a project member to manually trigger jobs — prevents untrusted code from running CI automatically
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID != $CI_PROJECT_ID
      when: manual
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

"pr-check:build-bot":
  extends: .buildkit-build-check
  stage: pr-check
  variables:
    DOCKERFILE_DIR: docker
    OUTPUT_NAME: discord-bot:ci
    OUTPUT_TARBALL: image-bot.tar
  rules: !reference [.image-build-rules, rules]

"pr-check:build-dispatcher":
  extends: .buildkit-build-check
  stage: pr-check
  variables:
    DOCKERFILE_DIR: docker
    DOCKERFILE_NAME: Dockerfile.dispatcher
    OUTPUT_NAME: discord-dispatcher:ci
    OUTPUT_TARBALL: image-dispatcher.tar
  rules: !reference [.image-build-rules, rules]

"pr-check:build-broker":
  extends: .buildkit-build-check
  stage: pr-check
  variables:
    DOCKERFILE_DIR: docker
    DOCKERFILE_NAME: Dockerfile.broker
    OUTPUT_NAME: discord-broker:ci
    OUTPUT_TARBALL: image-broker.tar
  rules: !reference [.image-build-rules, rules]

# MR-gate build-check for the downloader image. Needs no OCIR creds — it just
# builds the tarball (like pr-check:build-broker) — so it verifies
# Dockerfile.downloader (the git-drop/tarball-URL dep swap + the mesa/LLVM
# purge) on every MR that touches the image context. The default-branch publish
# is push:image-downloader below (terraform!184/!185 provisioned the repo+var).
"pr-check:build-downloader":
  extends: .buildkit-build-check
  stage: pr-check
  variables:
    DOCKERFILE_DIR: docker
    DOCKERFILE_NAME: Dockerfile.downloader
    OUTPUT_NAME: discord-downloader:ci
    OUTPUT_TARBALL: image-downloader.tar
  rules: !reference [.image-build-rules, rules]

# MR-gate build-check for the search image. Needs no OCIR creds — it just builds
# the tarball — so it verifies Dockerfile.search (the slim [search] extra: no
# yt-dlp/ffmpeg/deno, no boto3, no sqlalchemy) on every MR that touches the image
# context. The default-branch publish is push:image-search below.
"pr-check:build-search":
  extends: .buildkit-build-check
  stage: pr-check
  variables:
    DOCKERFILE_DIR: docker
    DOCKERFILE_NAME: Dockerfile.search
    OUTPUT_NAME: discord-search:ci
    OUTPUT_TARBALL: image-search.tar
  rules: !reference [.image-build-rules, rules]

"pr-check:scan-bot":
  extends: .trufflehog-image
  stage: pr-check
  needs: ["pr-check:build-bot"]
  variables:
    TRUFFLEHOG_IMAGE_TARBALL: image-bot.tar
  rules: !reference [.image-build-rules, rules]

"pr-check:scan-dispatcher":
  extends: .trufflehog-image
  stage: pr-check
  needs: ["pr-check:build-dispatcher"]
  variables:
    TRUFFLEHOG_IMAGE_TARBALL: image-dispatcher.tar
  rules: !reference [.image-build-rules, rules]

"pr-check:scan-broker":
  extends: .trufflehog-image
  stage: pr-check
  needs: ["pr-check:build-broker"]
  variables:
    TRUFFLEHOG_IMAGE_TARBALL: image-broker.tar
  rules: !reference [.image-build-rules, rules]

"pr-check:scan-downloader":
  extends: .trufflehog-image
  stage: pr-check
  needs: ["pr-check:build-downloader"]
  variables:
    TRUFFLEHOG_IMAGE_TARBALL: image-downloader.tar
  rules: !reference [.image-build-rules, rules]

"pr-check:scan-search":
  extends: .trufflehog-image
  stage: pr-check
  needs: ["pr-check:build-search"]
  variables:
    TRUFFLEHOG_IMAGE_TARBALL: image-search.tar
  rules: !reference [.image-build-rules, rules]

"test:tox-generate":
  extends: .tox-generate
  stage: test
  variables:
    # Pre-baked CI base image (ci-base-images:3.X) ships git + ffmpeg +
    # postgresql-client. ${CI_BASE_IMAGE_PATH} is the group-level plaintext
    # var provisioned in terraform/infra/gitlab.tf and is expanded here at
    # parent-pipeline time. $$ escapes the second dollar so ${PYTHON_VERSION}
    # reaches tox-generate's heredoc literally; the child pipeline's
    # parallel: matrix: then substitutes it per Python minor at runtime.
    TOX_BASE_IMAGE: '${CI_BASE_IMAGE_PATH}:$${PYTHON_VERSION}'
    TOX_GENERATE_IMAGE: '${CI_BASE_IMAGE_PATH}:3.14'

"test:tox":
  extends: .tox-pipeline
  stage: test

"push:tag":
  extends: .tag
  stage: push
  variables:
    GATE_ON_FRAGMENTS: 'true'
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
      when: on_success

"push:image-bot":
  extends: .buildkit-docker-push
  stage: push
  variables:
    DOCKERFILE_DIR: docker
  rules:
    - !reference [.not-on-changelog-fold, rules]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
      when: on_success

# On-demand native-heap-profiler build for the OOM leak hunt. Builds the bot
# image with the heaptrack binary baked in (INSTALL_HEAPTRACK=true) and pushes
# it under the :heaptrack channel tag via TAG_OVERRIDE, so it NEVER displaces
# :latest or the :<sha> pin. Manual-only and deliberately has no trigger-bump —
# docker-apps must not be auto-pinned to a diagnostic image. Deploy it by hand
# (HEAPTRACK_ENABLE=true + a writable output dir + a temporary mem bump) for a
# bounded window, pull the .zst, then revert. See docs findings/OOM runbook.
"push:image-bot-heaptrack":
  extends: .buildkit-docker-push
  stage: push
  variables:
    DOCKERFILE_DIR: docker
    BUILD_ARGS: '--opt build-arg:INSTALL_HEAPTRACK=true'
    TAG_OVERRIDE: 'heaptrack'
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
      when: manual
      allow_failure: true

# heaptrack variants of the split images, same channel-tag + manual + no-bump
# rules as the bot one. Each overrides OCI_REPO_NAME_64 to its per-image repo
# via before_script (mirrors the matching push:image-* job), since a masked-var
# YAML-level override no-ops. (No downloader variant yet — it has no OCIR push
# repo until terraform!185's OCI_DOWNLOADER_REPO_NAME_64 + its docker-apps
# Deployment land; its Dockerfile is heaptrack-ready for when it does.)
"push:image-dispatcher-heaptrack":
  extends: .buildkit-docker-push
  stage: push
  variables:
    DOCKERFILE_DIR: docker
    DOCKERFILE_NAME: Dockerfile.dispatcher
    BUILD_ARGS: '--opt build-arg:INSTALL_HEAPTRACK=true'
    TAG_OVERRIDE: 'heaptrack'
  before_script:
    - export OCI_REPO_NAME_64="$OCI_DISPATCHER_REPO_NAME_64"
    - !reference [.buildkit-docker-push, before_script]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
      when: manual
      allow_failure: true

"push:image-broker-heaptrack":
  extends: .buildkit-docker-push
  stage: push
  variables:
    DOCKERFILE_DIR: docker
    DOCKERFILE_NAME: Dockerfile.broker
    BUILD_ARGS: '--opt build-arg:INSTALL_HEAPTRACK=true'
    TAG_OVERRIDE: 'heaptrack'
  before_script:
    - export OCI_REPO_NAME_64="$OCI_BROKER_REPO_NAME_64"
    - !reference [.buildkit-docker-push, before_script]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
      when: manual
      allow_failure: true

# Producer side of the docker-apps image-pin bump flow. One trigger job
# per pushed image that has a consumer pin in docker-apps — each fires a
# downstream pipeline that rewrites the matching pin and opens an MR.
# bot-min/broker are not yet consumed by docker-apps.
# See github-workflows/gitlab/trigger-bump.yml for the template details.
trigger-bump-docker-apps:
  extends: .trigger-bump
  stage: push
  needs:
    - job: "push:image-bot"
      artifacts: true
  variables:
    BUMP_SOURCE: 'discord-bot'
  rules:
    - !reference [.not-on-changelog-fold, rules]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
      when: on_success

# OCI_REPO_NAME_64 is set per-image via shell-export in before_script rather
# than the YAML-level `OCI_REPO_NAME_64: $OCI_DISPATCHER_REPO_NAME_64` form,
# because GitLab does not reliably substitute when both vars are masked CI
# variables — the override silently no-ops and OCI_REPO_NAME_64 falls back to
# the project default (the bot repo), so the dispatcher image gets pushed to
# discord_bot:<sha>, racing the docker-push-bot tag. Shell expansion of
# $OCI_DISPATCHER_REPO_NAME_64 from env always works since the masked value is
# injected normally.
"push:image-dispatcher":
  extends: .buildkit-docker-push
  stage: push
  variables:
    DOCKERFILE_DIR: docker
    DOCKERFILE_NAME: Dockerfile.dispatcher
  before_script:
    - export OCI_REPO_NAME_64="$OCI_DISPATCHER_REPO_NAME_64"
    - !reference [.buildkit-docker-push, before_script]
  rules:
    - !reference [.not-on-changelog-fold, rules]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
      when: on_success

# Publishes discord_broker:<sha> on the default branch (OCIR repo + push perms
# provisioned in terraform/oci). No trigger-bump yet — docker-apps doesn't
# consume the broker pin until the F3 cutover; the bump producer lands then.
"push:image-broker":
  extends: .buildkit-docker-push
  stage: push
  variables:
    DOCKERFILE_DIR: docker
    DOCKERFILE_NAME: Dockerfile.broker
  before_script:
    - export OCI_REPO_NAME_64="$OCI_BROKER_REPO_NAME_64"
    - !reference [.buildkit-docker-push, before_script]
  rules:
    - !reference [.not-on-changelog-fold, rules]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
      when: on_success

# Publishes discord_downloader:<sha> on the default branch. OCIR repo + push
# perms and the OCI_DOWNLOADER_REPO_NAME_64 var come from terraform!184/!185.
# Same masked-var footgun as dispatcher/broker: shell-export OCI_REPO_NAME_64
# from $OCI_DOWNLOADER_REPO_NAME_64 in before_script rather than the YAML-level
# override (GitLab doesn't reliably substitute between two masked vars, so the
# image would otherwise fall back to the bot repo). docker-apps now consumes the
# downloader pin (downloader-app.yaml, deployed), so trigger-bump-docker-apps-downloader
# below publishes-then-bumps it like the others.
"push:image-downloader":
  extends: .buildkit-docker-push
  stage: push
  variables:
    DOCKERFILE_DIR: docker
    DOCKERFILE_NAME: Dockerfile.downloader
  before_script:
    - export OCI_REPO_NAME_64="$OCI_DOWNLOADER_REPO_NAME_64"
    - !reference [.buildkit-docker-push, before_script]
  rules:
    - !reference [.not-on-changelog-fold, rules]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
      when: on_success

# Publishes discord_search:<sha> on the default branch. Same masked-var footgun
# as dispatcher/broker/downloader: shell-export OCI_REPO_NAME_64 from
# $OCI_SEARCH_REPO_NAME_64 in before_script rather than the YAML-level override
# (GitLab doesn't reliably substitute between two masked vars, so the image would
# otherwise fall back to the bot repo and race the bot's tag).
#
# ORDERING: this job needs the OCIR repo + push perms + OCI_SEARCH_REPO_NAME_64
# from terraform (mirrors terraform!184/!185 for the downloader). Merging this MR
# before that lands turns main's push stage red. No trigger-bump yet either —
# docker-apps has no discord-search pin until the Phase A Deployment; the bump
# producer lands with it, consumer-first (the !842-before-!178 lesson).
"push:image-search":
  extends: .buildkit-docker-push
  stage: push
  variables:
    DOCKERFILE_DIR: docker
    DOCKERFILE_NAME: Dockerfile.search
  before_script:
    - export OCI_REPO_NAME_64="$OCI_SEARCH_REPO_NAME_64"
    - !reference [.buildkit-docker-push, before_script]
  rules:
    - !reference [.not-on-changelog-fold, rules]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
      when: on_success

trigger-bump-docker-apps-dispatcher:
  extends: .trigger-bump
  stage: push
  needs:
    - job: "push:image-dispatcher"
      artifacts: true
  variables:
    BUMP_SOURCE: 'discord-dispatcher'
  rules:
    - !reference [.not-on-changelog-fold, rules]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
      when: on_success

# docker-apps now consumes the discord_broker pin (broker-app.yaml, deployed),
# so publish-then-bump it like bot/dispatcher. BUMP_SOURCE=discord-broker drives
# the docker-apps bump-discord-broker-pin + cleanup-discord-broker jobs.
trigger-bump-docker-apps-broker:
  extends: .trigger-bump
  stage: push
  needs:
    - job: "push:image-broker"
      artifacts: true
  variables:
    BUMP_SOURCE: 'discord-broker'
  rules:
    - !reference [.not-on-changelog-fold, rules]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
      when: on_success

# docker-apps consumes the discord_downloader pin (downloader-app.yaml, deployed),
# so publish-then-bump it like bot/dispatcher/broker. BUMP_SOURCE=discord-downloader
# drives the docker-apps bump-discord-downloader-pin + cleanup-discord-downloader jobs.
trigger-bump-docker-apps-downloader:
  extends: .trigger-bump
  stage: push
  needs:
    - job: "push:image-downloader"
      artifacts: true
  variables:
    BUMP_SOURCE: 'discord-downloader'
  rules:
    - !reference [.not-on-changelog-fold, rules]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
      when: on_success

"notify:mr-opened":
  extends: .discord-notify
  stage: notify
  needs: []
  variables:
    NOTIFY_TYPE: mr_opened
    DISCORD_WEBHOOK_URL: $DISCORD_MR_OPENED_WEBHOOK
  rules:
    # Fork MRs require a project member to manually trigger jobs — prevents untrusted code from running CI automatically
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID != $CI_PROJECT_ID
      when: manual
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always

"notify:merged":
  extends: .discord-notify
  stage: notify
  needs: []
  variables:
    NOTIFY_TYPE: mr_merged
    DISCORD_WEBHOOK_URL: $DISCORD_MR_MERGED_WEBHOOK
  rules:
    - !reference [.not-on-changelog-fold, rules]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
      when: always

renovate:
  extends: .renovate
  stage: renovate
  variables:
    GITHUB_COM_TOKEN: $GITHUB_BOT_TOKEN
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

# Scheduled prune of stale automation branches (bump/* + renovate/*) left
# behind because remove_source_branch only fires on MR merge, not on the
# API-driven close of a superseded bump/renovate MR. Rides the weekly
# schedule and reuses RENOVATE_TOKEN. See the github-workflows
# .branch-cleanup template and docs runbooks/branch-cleanup.md.
branch-cleanup:
  extends: .branch-cleanup
  stage: renovate
  variables:
    CLEANUP_AGE_DAYS: "30"
    DRY_RUN: "false"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
