  - project: 'tnoff-projects/github-workflows'
    ref: efe31bf2562d945b344d7bcac48433ef70c80a83
    file: '/gitlab/tag.yml'
  - project: 'tnoff-projects/github-workflows'
    ref: efe31bf2562d945b344d7bcac48433ef70c80a83
    file: '/gitlab/discord-notify.yml'
  - project: 'tnoff-projects/github-workflows'
    ref: efe31bf2562d945b344d7bcac48433ef70c80a83
    file: '/gitlab/renovate.yml'
  - project: 'tnoff-projects/github-workflows'
    ref: efe31bf2562d945b344d7bcac48433ef70c80a83
    file: '/gitlab/branch-cleanup.yml'
  - project: 'tnoff-projects/github-workflows'
    ref: efe31bf2562d945b344d7bcac48433ef70c80a83
    file: '/gitlab/bump-version.yml'
  - project: 'tnoff-projects/github-workflows'
    ref: efe31bf2562d945b344d7bcac48433ef70c80a83
    file: '/gitlab/trufflehog.yml'
  - project: 'tnoff-projects/github-workflows'
    ref: efe31bf2562d945b344d7bcac48433ef70c80a83
    file: '/gitlab/trufflehog-image.yml'
  - project: 'tnoff-projects/github-workflows'
    ref: efe31bf2562d945b344d7bcac48433ef70c80a83
    file: '/gitlab/trigger-bump.yml'
  - project: 'tnoff-projects/github-workflows'
    ref: efe31bf2562d945b344d7bcac48433ef70c80a83
    file: '/gitlab/buildkit-build-check.yml'
  - project: 'tnoff-projects/github-workflows'
    ref: efe31bf2562d945b344d7bcac48433ef70c80a83
    file: '/gitlab/buildkit-docker-push.yml'
  - project: 'tnoff-projects/github-workflows'
    ref: efe31bf2562d945b344d7bcac48433ef70c80a83
    file: '/gitlab/tox-pipeline.yml'

default:
  tags:
    - self-hosted

stages:
  - pr-check
  - test
  - push
  - notify
  - renovate

# Shared rules for the image build-check + trufflehog image-scan jobs. These
# are a pre-merge gate: they verify the image builds and scan it for secrets.
# MR-only by design — on the default branch they add nothing, because
# push:image-* builds and publishes the image independently (needs: []), so
# re-building it in pr-check just to scan it duplicates the push's build and
# burns runner slots (and the scan already ran on the MR). On MRs that don't
# touch anything baked into the image (the docker/ context, python source,
# deps, or version), skip them too. Fork MRs keep the manual gate.
.image-build-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID != $CI_PROJECT_ID
      when: manual
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - discord_bot/**/*
        - alembic/**/*
        - alembic.ini
        - docker/**/*
        - pyproject.toml
        - VERSION

bump-version:
  extends: .bump-version
  variables:
    GITLAB_PUSH_TOKEN: $RENOVATE_TOKEN
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^renovate\/dev-/

"pr-check:secrets":
  extends: .trufflehog
  stage: pr-check
  rules:
    # Fork MRs require a project member to manually trigger jobs — prevents untrusted code from running CI automatically
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID != $CI_PROJECT_ID
      when: manual
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

"pr-check:build-bot":
  extends: .buildkit-build-check
  stage: pr-check
  variables:
    DOCKERFILE_DIR: docker
    OUTPUT_NAME: discord-bot:ci
    OUTPUT_TARBALL: image-bot.tar
  rules: !reference [.image-build-rules, rules]

"pr-check:build-dispatcher":
  extends: .buildkit-build-check
  stage: pr-check
  variables:
    DOCKERFILE_DIR: docker
    DOCKERFILE_NAME: Dockerfile.dispatcher
    OUTPUT_NAME: discord-dispatcher:ci
    OUTPUT_TARBALL: image-dispatcher.tar
  rules: !reference [.image-build-rules, rules]

"pr-check:build-broker":
  extends: .buildkit-build-check
  stage: pr-check
  variables:
    DOCKERFILE_DIR: docker
    DOCKERFILE_NAME: Dockerfile.broker
    OUTPUT_NAME: discord-broker:ci
    OUTPUT_TARBALL: image-broker.tar
  rules: !reference [.image-build-rules, rules]

"pr-check:scan-bot":
  extends: .trufflehog-image
  stage: pr-check
  needs: ["pr-check:build-bot"]
  variables:
    TRUFFLEHOG_IMAGE_TARBALL: image-bot.tar
  rules: !reference [.image-build-rules, rules]

"pr-check:scan-dispatcher":
  extends: .trufflehog-image
  stage: pr-check
  needs: ["pr-check:build-dispatcher"]
  variables:
    TRUFFLEHOG_IMAGE_TARBALL: image-dispatcher.tar
  rules: !reference [.image-build-rules, rules]

"pr-check:scan-broker":
  extends: .trufflehog-image
  stage: pr-check
  needs: ["pr-check:build-broker"]
  variables:
    TRUFFLEHOG_IMAGE_TARBALL: image-broker.tar
  rules: !reference [.image-build-rules, rules]

"test:tox-generate":
  extends: .tox-generate
  stage: test
  variables:
    # Pre-baked CI base image (ci-base-images:3.X) ships git + ffmpeg +
    # postgresql-client. ${CI_BASE_IMAGE_PATH} is the group-level plaintext
    # var provisioned in terraform/infra/gitlab.tf and is expanded here at
    # parent-pipeline time. $$ escapes the second dollar so ${PYTHON_VERSION}
    # reaches tox-generate's heredoc literally; the child pipeline's
    # parallel: matrix: then substitutes it per Python minor at runtime.
    TOX_BASE_IMAGE: '${CI_BASE_IMAGE_PATH}:$${PYTHON_VERSION}'
    TOX_GENERATE_IMAGE: '${CI_BASE_IMAGE_PATH}:3.14'

"test:tox":
  extends: .tox-pipeline
  stage: test

"push:tag":
  extends: .tag
  stage: push
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
      when: on_success

"push:image-bot":
  extends: .buildkit-docker-push
  stage: push
  variables:
    DOCKERFILE_DIR: docker

# Producer side of the docker-apps image-pin bump flow. One trigger job
# per pushed image that has a consumer pin in docker-apps — each fires a
# downstream pipeline that rewrites the matching pin and opens an MR.
# bot-min/broker are not yet consumed by docker-apps.
# See github-workflows/gitlab/trigger-bump.yml for the template details.
trigger-bump-docker-apps:
  extends: .trigger-bump
  stage: push
  needs:
    - job: "push:image-bot"
      artifacts: true
  variables:
    BUMP_SOURCE: 'discord-bot'

# OCI_REPO_NAME_64 is set per-image via shell-export in before_script rather
# than the YAML-level `OCI_REPO_NAME_64: $OCI_DISPATCHER_REPO_NAME_64` form,
# because GitLab does not reliably substitute when both vars are masked CI
# variables — the override silently no-ops and OCI_REPO_NAME_64 falls back to
# the project default (the bot repo), so the dispatcher image gets pushed to
# discord_bot:<sha>, racing the docker-push-bot tag. Shell expansion of
# $OCI_DISPATCHER_REPO_NAME_64 from env always works since the masked value is
# injected normally.
"push:image-dispatcher":
  extends: .buildkit-docker-push
  stage: push
  variables:
    DOCKERFILE_DIR: docker
    DOCKERFILE_NAME: Dockerfile.dispatcher
  before_script:
    - export OCI_REPO_NAME_64="$OCI_DISPATCHER_REPO_NAME_64"
    - !reference [.buildkit-docker-push, before_script]

# Publishes discord_broker:<sha> on the default branch (OCIR repo + push perms
# provisioned in terraform/oci). No trigger-bump yet — docker-apps doesn't
# consume the broker pin until the F3 cutover; the bump producer lands then.
"push:image-broker":
  extends: .buildkit-docker-push
  stage: push
  variables:
    DOCKERFILE_DIR: docker
    DOCKERFILE_NAME: Dockerfile.broker
  before_script:
    - export OCI_REPO_NAME_64="$OCI_BROKER_REPO_NAME_64"
    - !reference [.buildkit-docker-push, before_script]

trigger-bump-docker-apps-dispatcher:
  extends: .trigger-bump
  stage: push
  needs:
    - job: "push:image-dispatcher"
      artifacts: true
  variables:
    BUMP_SOURCE: 'discord-dispatcher'

# docker-apps now consumes the discord_broker pin (broker-app.yaml, deployed),
# so publish-then-bump it like bot/dispatcher. BUMP_SOURCE=discord-broker drives
# the docker-apps bump-discord-broker-pin + cleanup-discord-broker jobs.
trigger-bump-docker-apps-broker:
  extends: .trigger-bump
  stage: push
  needs:
    - job: "push:image-broker"
      artifacts: true
  variables:
    BUMP_SOURCE: 'discord-broker'

"notify:mr-opened":
  extends: .discord-notify
  stage: notify
  needs: []
  variables:
    NOTIFY_TYPE: mr_opened
    DISCORD_WEBHOOK_URL: $DISCORD_MR_OPENED_WEBHOOK
  rules:
    # Fork MRs require a project member to manually trigger jobs — prevents untrusted code from running CI automatically
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID != $CI_PROJECT_ID
      when: manual
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always

"notify:push-failure":
  extends: .discord-notify
  stage: notify
  needs: ["push:tag", "push:image-bot", "push:image-dispatcher", "push:image-broker", trigger-bump-docker-apps, trigger-bump-docker-apps-dispatcher, trigger-bump-docker-apps-broker]
  variables:
    NOTIFY_TYPE: failure
    DISCORD_WEBHOOK_URL: $DISCORD_BUILD_FAILURE_WEBHOOK
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
      when: on_failure

"notify:renovate-failure":
  extends: .discord-notify
  stage: renovate
  needs: [renovate]
  variables:
    NOTIFY_TYPE: failure
    DISCORD_WEBHOOK_URL: $DISCORD_BUILD_FAILURE_WEBHOOK
    NOTIFY_MESSAGE: 'Renovate failed'
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: on_failure

"notify:merged":
  extends: .discord-notify
  stage: notify
  needs: []
  variables:
    NOTIFY_TYPE: mr_merged
    DISCORD_WEBHOOK_URL: $DISCORD_MR_MERGED_WEBHOOK
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
      when: always

renovate:
  extends: .renovate
  stage: renovate
  variables:
    GITHUB_COM_TOKEN: $GITHUB_BOT_TOKEN
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

# Scheduled prune of stale automation branches (bump/* + renovate/*) left
# behind because remove_source_branch only fires on MR merge, not on the
# API-driven close of a superseded bump/renovate MR. Rides the weekly
# schedule and reuses RENOVATE_TOKEN. See the github-workflows
# .branch-cleanup template and docs runbooks/branch-cleanup.md.
branch-cleanup:
  extends: .branch-cleanup
  stage: renovate
  variables:
    CLEANUP_AGE_DAYS: "30"
    DRY_RUN: "false"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

"notify:cleanup-failure":
  extends: .discord-notify
  stage: renovate
  needs: [branch-cleanup]
  variables:
    NOTIFY_TYPE: failure
    DISCORD_WEBHOOK_URL: $DISCORD_BUILD_FAILURE_WEBHOOK
    NOTIFY_MESSAGE: 'Branch cleanup failed'
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: on_failure
