[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-db"
dynamic = ["version"]
description = "discord-bot: owns the database schema and the engine (postgres or sqlite)"
authors = [
    {name = "Tyler D. North", email = "me@tyler-north.com"},
]
requires-python = ">=3.11"
# dappertable is not a leak from the broker: PlaylistClient calls
# shorten_string when it builds playlist entries, so the pod serving those
# routes imports it for real. No boto3 -- VideoCacheClient is a pure catalog.
dependencies = [
    # discord_core, pinned to a real released tag rather than the local
    # checkout path -- criterion 8 step 7. All six pods pin the IDENTICAL tag
    # string; tests/cli/test_package_pins.py enforces that they never drift
    # apart.
    "discord-core @ https://github.com/tnoff/discord-bot/archive/refs/tags/core-v3.0.4.tar.gz#subdirectory=discord_core",
    "SQLAlchemy==2.0.52",
    # No import site. SQLAlchemy's async driver, named in the URL cli/_lib/db
    # builds ("postgresql+asyncpg"); absent, nothing can open the database.
    "asyncpg==0.31.0",
    # No import site. SQLAlchemy's async SQLite driver, named in the URL
    # cli/_lib/db_url builds ("sqlite+aiosqlite") for a sqlite DSN.
    "aiosqlite==0.22.1",
    # No import site. The migration CLI; this is the only image that COPYs
    # alembic/ and alembic.ini and can run `alembic upgrade head`.
    "alembic==1.19.2",
    "dappertable @ https://github.com/tnoff/dappertable/archive/refs/tags/v1.1.9.tar.gz",
]

[project.scripts]
discord-db = "discord_db.cli.database:main"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
where = [".."]
include = ["discord_db", "discord_db.*"]
# Excluded, not just left unmentioned: discord_db/tests/ is a real,
# discoverable package (it has __init__.py throughout, the same
# convention the old central tests/ used), so the include globs above
# would otherwise sweep it into this distribution. Verified empirically
# -- discord_db.tests, discord_db.tests.cli, etc. showed up in a real
# PackageFinder.find() call before this exclude was added.
exclude = ["discord_db.tests", "discord_db.tests.*"]
