[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "discord_bot"
dynamic = ["version"]
description = "Discord Bot"
authors = [
    {name = "Tyler D. North", email = "me@tyler-north.com"},
]
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "redis==8.1.0",
    "async-timeout==5.0.1",
    "discord.py==2.7.1",
    "pydantic==2.13.4",
    "pydantic-yaml==1.7.0",
    "opentelemetry-sdk==1.44.0",
    # Dont pin these so dependabot updates are easier
    "opentelemetry-instrumentation-requests",
    "opentelemetry-instrumentation-redis",
    "opentelemetry-instrumentation-logging",
    "opentelemetry-instrumentation-sqlalchemy",
    "opentelemetry-exporter-otlp",
    "click==8.4.2",
    "pyaml-env==1.2.2",
    "psutil==7.2.2",
    "pytz==2026.3.post1",
    "requests==2.34.2",
]

[project.optional-dependencies]
bot = [
    "dappertable @ https://gitlab.com/tnoff-projects/dappertable/-/archive/v1.0.0/dappertable-v1.0.0.tar.gz",
    "alembic==1.19.1",
    "beautifulsoup4==4.15.0",
    "boto3==1.43.67",
    "google-api-python-client==2.198.0",
    "moviepy==2.2.1",
    "davey==0.1.6",
    "PyNaCl==1.6.2",
    "SQLAlchemy==2.0.51",
    "spotipy==2.26.0",
    "yt-dlp==2026.7.4",
    # Dont pin, let yt-dlp install
    "yt-dlp-ejs",
    "ytmusicapi==1.12.2",
    "asyncpg==0.31.0",
]
# Slim extra for the standalone search pod (cli/search.py, Dockerfile.search):
# the search tier is thin HTTP clients only — no yt-dlp/ffmpeg/deno, no boto3, no
# sqlalchemy — so the image installs this instead of [bot].
#
# ytmusicapi is listed in BOTH extras, PERMANENTLY — but the HA bot no longer
# IMPORTS it.  Those are two separate things and it is worth being precise:
#
#   Import chain: fixed.  utils/integrations/youtube_music.py defers the real
#   wrapper to first attribute access, so a bot process that never builds a
#   client never loads ytmusicapi.  Guarded by
#   tests/cogs/test_music.py::test_bot_import_chain_does_not_pull_ytmusicapi.
#
#   Installed dependency: stays.  Single-process mode (no
#   music.youtube_music_search_client — docker/docker-compose.yml, local dev, and
#   the whole test suite via tox's extras = bot,test) runs the search worker
#   in-process and constructs a real client.  HA moves where the search loop
#   RUNS; it does not remove the in-process mode, so [bot] must still be able to
#   do it.  Unlike sqlalchemy on the dispatcher, which has no in-process fallback
#   to support and could therefore be dropped outright.
#
# Dropping it from [bot] would buy 1.1 MB of pure Python whose only dependency
# (requests) every image already installs, at the cost of breaking single-process
# off a plain [bot] install.  Not worth it — revisit only if single-process is
# retired.
#
# media_search's spotipy + google-api-python-client join this extra when those
# providers fold into the pod.
search = [
    "ytmusicapi==1.12.2",
]
test = [
    "bandit==1.9.4",
    "fakeredis==2.37.0",
    "freezegun==1.5.5",
    "pylint-pydantic==0.4.1",
    "pylint==4.0.7",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-freezegun==0.4.2",
    "pytest-mock==3.15.1",
    "pytest-postgresql==8.1.0",
    "psycopg[binary]==3.3.4",
    "requests-mock==1.12.1",
    # Currently required for pytest-freezegun, can remove once they have that fixed
    "setuptools==84.0.0",
    "tox==4.58.0",
]

[project.scripts]
discord-bot = "discord_bot.cli.full:main"
discord-bot-min = "discord_bot.cli.bot:main"
discord-dispatcher = "discord_bot.cli.dispatcher:main"
discord-broker = "discord_bot.cli.broker:main"
discord-downloader = "discord_bot.cli.downloader:main"
discord-search = "discord_bot.cli.search:main"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
exclude = ["tests*", "docs*"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
python_files = ["tests/*.py"]
filterwarnings = [
    "error",
    "error::requests.exceptions.RequestsDependencyWarning",
    # pytest-freezegun uses the deprecated distutils LooseVersion
    "ignore::DeprecationWarning:pytest_freezegun",
    # discord.py imports audioop (deprecated in 3.11, removed in 3.13); message-based because
    # audioop warns with stacklevel=2 so the warning is attributed to discord/player.py, not audioop
    "ignore:'audioop' is deprecated:DeprecationWarning",
    # discord.py calls asyncio.iscoroutinefunction() (deprecated in 3.14, removed in 3.16);
    # message-based because the warning is attributed to discord/ext/commands/core.py, not asyncio
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
    # music.py uses TemporaryDirectory().name to get a path, immediately discarding the object
    # (intentional pattern, see pylint:disable=consider-using-with comments); stdlib cleans them up
    "ignore:Implicitly cleaning up <TemporaryDirectory:ResourceWarning:tempfile",
    # pytest-asyncio leaks an unclosed event loop between tests in Python 3.11; the two AF_UNIX
    # sockets below are the event loop's internal self-pipe wakeup mechanism and disappear with it;
    # this does not reproduce on Python 3.12+ where event loop creation semantics changed
    "ignore:unclosed event loop:ResourceWarning",
    "ignore:unclosed <socket.socket:ResourceWarning",
    # opentelemetry 1.42.0 dropped the importlib_metadata backport in favor of stdlib
    # importlib.metadata; on Python 3.11 entry_points() returns a SelectableGroups mapping
    # whose .values() is deprecated. The class is removed in Python 3.12+, so this only
    # affects py311.
    "ignore:SelectableGroups dict interface is deprecated:DeprecationWarning",
]
