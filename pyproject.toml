[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-bot-repo"
dynamic = ["version"]
description = "discord-bot: shared test tooling and cross-package checks"
authors = [
    {name = "Tyler D. North", email = "me@tyler-north.com"},
]
requires-python = ">=3.11"
# This project installs NO production code of its own any more. Criterion 8
# step 5 gave each of the seven packages (discord_core plus the six pods) its
# own pyproject.toml with its own real `dependencies` list, replacing the
# single monorepo extra system this file used to hold -- the capability
# groups and per-image extras that lived here are now split across
# discord_core/pyproject.toml and each pod's own. See per-image-code-split.md
# criterion 8 step 5 for the full record.
#
# What is left here is the one thing that has nowhere else to live: shared
# test tooling and the pytest/coverage config the whole-tree test run needs,
# since tests/ (boundary and cross-package checks) has nowhere else to live
# either. `pip install -e .[test]` plus a path install of all seven packages
# is what the local CI gate and tox.ini both actually run.
#
# Versioning stays SHARED across all eight pyproject.toml files in this repo
# for now (one VERSION/CHANGELOG.md) -- independent per-package tag series is
# criterion 8 step 6, not this one.
[project.optional-dependencies]
test = [
    "bandit==1.9.4",
    "fakeredis==2.37.1",
    "freezegun==1.5.5",
    # Validates the generated docs/openapi/*.yaml are real OpenAPI rather than
    # plausible-looking YAML. The generator is deterministic, so the risk is an
    # edit to the generator producing a document that reads fine and no tool
    # accepts -- which is precisely the failure that only shows up in Backstage
    # at ingestion, far from the change that caused it.
    "openapi-spec-validator==0.9.0",
    "pylint-pydantic==0.4.1",
    "pylint==4.0.8",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-freezegun==0.4.2",
    "pytest-mock==3.15.1",
    "pytest-postgresql==9.0.0",
    "psycopg[binary]==3.3.4",
    "requests-mock==1.12.1",
    # Currently required for pytest-freezegun, can remove once they have that fixed
    "setuptools==84.0.0",
    "tox==4.61.1",
]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools]
# Each console script moved to live on its own pod's pyproject.toml (discord-bot
# on discord_gateway, discord-dispatcher on discord_dispatcher, and so on) --
# this project no longer ships any of the code they point at.
#
# This project owns no importable package of its own any more: the seven
# discord_*/pyproject.toml files each claim their own directory (see their
# `[tool.setuptools.packages.find]`), and alembic/ has no __init__.py so
# setuptools would otherwise discover it as a namespace package and write
# env.py and versions/ into site-packages/alembic/ -- the installed alembic
# library's own directory. `packages = []` means this editable install exists
# only to resolve the `test` extra and carry the shared tool config below.
packages = []

[tool.pytest.ini_options]
asyncio_mode = "strict"
markers = [
    "postgres: needs a real postgres server; skipped unless POSTGRES_TEST_HOST is set",
]
asyncio_default_fixture_loop_scope = "function"
python_files = ["tests/*.py"]
filterwarnings = [
    "error",
    "error::requests.exceptions.RequestsDependencyWarning",
    # pytest-freezegun uses the deprecated distutils LooseVersion
    "ignore::DeprecationWarning:pytest_freezegun",
    # discord.py imports audioop (deprecated in 3.11, removed in 3.13); message-based because
    # audioop warns with stacklevel=2 so the warning is attributed to discord/player.py, not audioop
    "ignore:'audioop' is deprecated:DeprecationWarning",
    # discord.py calls asyncio.iscoroutinefunction() (deprecated in 3.14, removed in 3.16);
    # message-based because the warning is attributed to discord/ext/commands/core.py, not asyncio
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
    # music.py uses TemporaryDirectory().name to get a path, immediately discarding the object
    # (intentional pattern, see pylint:disable=consider-using-with comments); stdlib cleans them up
    "ignore:Implicitly cleaning up <TemporaryDirectory:ResourceWarning:tempfile",
    # pytest-asyncio leaks an unclosed event loop between tests in Python 3.11; the two AF_UNIX
    # sockets below are the event loop's internal self-pipe wakeup mechanism and disappear with it;
    # this does not reproduce on Python 3.12+ where event loop creation semantics changed
    "ignore:unclosed event loop:ResourceWarning",
    "ignore:unclosed <socket.socket:ResourceWarning",
    # opentelemetry 1.42.0 dropped the importlib_metadata backport in favor of stdlib
    # importlib.metadata; on Python 3.11 entry_points() returns a SelectableGroups mapping
    # whose .values() is deprecated. The class is removed in Python 3.12+, so this only
    # affects py311.
    "ignore:SelectableGroups dict interface is deprecated:DeprecationWarning",
]

[tool.coverage.run]
# ONE source root, so every file has ONE unambiguous path in coverage.xml.
#
# With several `--cov=<root>` flags coverage writes one <source> per root and
# strips the matching root off each filename, so `discord_core/utils/otel.py`
# is recorded as `utils/otel.py`. diff-cover then reconstructs the full path by
# testing each <source> in turn, and for a name present under more than one
# root it takes the first that exists.
#
# Measured at the media_search move: `__init__.py`, `routes/__init__.py`,
# `types/__init__.py` and `utils/__init__.py` each live under several roots and
# coverage.xml held ONE entry for each. Harmless at three roots -- every
# collision is a codeless package init with zero measured lines -- and not
# harmless at twelve, where a real module can collide. The gate would not fail;
# it would report the wrong file's coverage.
#
# `relative_files` does NOT fix this. It makes the <source> entries relative and
# leaves the filenames stripped, which was measured before choosing this.
source = ["."]
omit = [
    "tests/*",
    # Criterion 8 step 5 nested each package's own test tree at
    # discord_core/tests/, discord_gateway/tests/, etc., mirroring the source
    # layout -- so "tests/*" alone (matching only the central location) no
    # longer omits most of the suite from its own coverage report. One entry
    # per package rather than a single "*/tests/*": that would also match a
    # future PRODUCTION path that happens to contain a "tests" segment, which
    # is exactly the kind of over-broad pattern this project's own comments
    # elsewhere warn against.
    "discord_core/tests/*",
    "discord_gateway/tests/*",
    "discord_broker/tests/*",
    "discord_db/tests/*",
    "discord_dispatcher/tests/*",
    "discord_downloader/tests/*",
    "discord_search/tests/*",
    "alembic/*",
    ".tox/*",
    ".venv/*",
    "setup.py",
]
