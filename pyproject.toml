[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "discord_bot"
dynamic = ["version"]
description = "Discord Bot"
authors = [
    {name = "Tyler D. North", email = "me@tyler-north.com"},
]
requires-python = ">=3.11"
# THE CORE SET. Not an extra, and it cannot be one: an extra is optional by
# definition, and pip has no name for "always installed" other than this list.
# Everything here is imported by all five entrypoints — the aiohttp/redis
# transport, the pydantic config models, the OTel stack and the CLI plumbing.
#
# discord.py is deliberately NOT here any more. It sat in the core set because
# utils/otel imported Context at module scope for a runtime isinstance, so every
# image pulled it; discord-bot!248 closed that and the three worker images
# stopped importing it. It is now paid for by [gateway], i.e. by the two images
# that actually talk to Discord.
#
# Adding something here puts it on all five images. Prefer a capability group.
dependencies = [
    "aiohttp>=3.9",
    "redis==8.1.0",
    "async-timeout==5.0.1",
    "pydantic==2.13.5",
    "pydantic-yaml==1.7.0",
    "opentelemetry-sdk==1.44.0",
    # Dont pin these so dependabot updates are easier
    "opentelemetry-instrumentation-requests",
    "opentelemetry-instrumentation-redis",
    "opentelemetry-instrumentation-logging",
    "opentelemetry-instrumentation-sqlalchemy",
    "opentelemetry-exporter-otlp",
    "click==8.5.0",
    "pyaml-env==1.2.2",
    "psutil==7.2.2",
    "pytz==2026.3.post1",
    "requests==2.34.2",
]

[project.optional-dependencies]
# ---------------------------------------------------------------------------
# CAPABILITY GROUPS — what a thing can DO. One pin per package, here and nowhere
# else.
#
# The per-image extras below are built from these by self-reference rather than
# by listing packages again. That is deliberate: the first cut of this split
# repeated the pins in each image extra, and within a single renovate bump the
# copies had already drifted — [bot] moved to yt-dlp 2026.8.19 while the
# downloader, the image that actually runs yt-dlp, was left pinned to 2026.7.4.
# Two lists describing one fact stay correct only while somebody keeps them in
# step, which is the same failure this project already found in the console-script
# list, the per-image forbidden tuples and the dashboard panel scoping.
#
# Add a package to exactly one group. If two images need it, they compose the
# same group; they do not each name the package.
#
# Group names are HYPHENATED, not underscored, and that is load-bearing. PEP 685
# normalises extra names, so an extra declared as search_providers is published
# in the metadata as search-providers -- and a self-reference written with the
# underscore then resolves to nothing, SILENTLY. It installs no packages and
# raises no error. That is exactly how ytmusicapi and the search providers went
# missing from the tox environment while every hyphen-free group resolved fine.
# ---------------------------------------------------------------------------
gateway = [
    # Talking to Discord at all. Only the bot and the dispatcher do.
    "discord.py==2.7.1",
]
voice = [
    # Playing audio into a voice channel. The gateway needs this; the dispatcher
    # does NOT, which is why it is separate from [gateway] rather than folded in.
    # Neither package has an import site — discord.py loads them itself, and says
    # so on startup when they are missing ("PyNaCl is not installed, voice will
    # NOT be supported"), which is the log line the dispatcher has always carried.
    "discord_bot[gateway]",
    "PyNaCl==1.6.2",
    "davey==0.1.6",
]
database = [
    # The postgres schema: markov, playlists, the video cache.
    "SQLAlchemy==2.0.52",
    # No import site. SQLAlchemy's async driver, named in the URL cli/_lib/db
    # builds ("postgresql+asyncpg"); absent, nothing can open the database.
    "asyncpg==0.31.0",
    # No import site. The migration CLI. Every image that COPYs alembic/ and
    # alembic.ini needs it to be able to run `alembic upgrade head`.
    "alembic==1.19.1",
]
storage = [
    # S3 object storage for finished media.
    "boto3==1.43.77",
]
rendering = [
    # Table/bundle rendering for what gets posted back to Discord.
    # dappertable is GitHub-canonical; the GitLab copy is frozen. Both URLs
    # still resolve, but only the GitHub one can ever be bumped past the
    # freeze. Verified installable at 1.0.0 from this URL.
    "dappertable @ https://github.com/tnoff/dappertable/archive/refs/tags/v1.0.0.tar.gz",
]
downloading = [
    # yt-dlp and its JS runtime helper. The downloader pod only.
    "yt-dlp==2026.8.19",
    # Dont pin, let yt-dlp install
    "yt-dlp-ejs",
]
search-providers = [
    # Metadata providers source expansion runs against.
    #
    # The search pod's, and ONLY the search pod's, as of the media_search cutover
    # -- the cog reaches these through HttpMediaSearchClient now and imports
    # neither SDK. That is what this group was carved out of [bot] to make
    # possible, and it is why beautifulsoup4 is NOT here. bs4 was in this group
    # once and it did not belong: its only import site is cogs/urban.py, which
    # cli/_lib/cog_registry imports unconditionally, so the bot needs it no matter
    # what media_search does. It rode this group's name to the edge of leaving the
    # bot image with it. A group named for a capability has to hold only packages
    # that serve it, or the next person to move the group by its name takes an
    # unrelated package along.
    "spotipy==2.26.0",
    "google-api-python-client==2.199.0",
]
scraping = [
    # Parsing HTML out of a page the API does not cover. The urban cog only.
    "beautifulsoup4==4.15.0",
]
youtube-music = [
    # The search pod's only tier-defining dependency.
    #
    # It lives HERE ONLY, as of the dual-path collapse. It used to be in the bot
    # set too, because the cog built a real YoutubeMusicClient whenever
    # music.youtube_music_search_client was absent — single-process, local dev and
    # the whole test suite — so the bot image had to be able to run the search
    # worker even though the HA bot never imported it. That fallback is gone: the
    # cog is a client only. This is the drop discord-bot!209 tried to make and
    # could not (projects/discord-bot-ha-only).
    "ytmusicapi==1.12.2",
]

# ---------------------------------------------------------------------------
# PER-IMAGE EXTRAS — what each deployed image installs. Exactly one per image,
# named after the image, composed from the capability groups above.
#
# These are derived from each entrypoint's MEASURED import set, not from reading
# the code, and docs/image-dependencies.md is generated from the same
# measurement. tests/cli/test_import_boundaries.py asserts the two agree in both
# directions: a package an image imports but does not install is an ImportError
# at pod start, and a package it installs but no longer imports is dead weight.
# ---------------------------------------------------------------------------
bot = [
    # No search-providers: source expansion is a round trip to the search pod, so
    # spotipy and google-api-python-client are the pod's and not this image's.
    # scraping stays -- bs4 is the urban cog's, which has nothing to do with
    # media_search and is imported unconditionally by the cog registry.
    "discord_bot[gateway,voice,database,storage,rendering,scraping]",
]
dispatcher = [
    # The strictest image: the core set plus discord.py and nothing else. It sends
    # and edits real messages (workers/message_dispatcher imports Message, Bot and
    # NotFound), which is why it is the one non-gateway image that genuinely needs
    # discord.py. It ran on the core dependencies alone until now, so its boundary
    # was discipline; naming an extra makes it a declaration.
    "discord_bot[gateway]",
]
broker = [
    # Owns the video cache and the S3 checkout, and renders bundles.
    "discord_bot[database,storage,rendering]",
]
downloader = [
    # Downloads media and uploads the result. No database, no rendering, no
    # search — it used to install the bot's whole set and carry all three.
    "discord_bot[downloading,storage]",
]
search = [
    # Thin HTTP clients. search-providers joined here when media_search folded in
    # -- hyphens, per the PEP 685 note above: a self-reference spelled
    # search_providers resolves to nothing and says so nowhere.
    #
    # It is still installed in [bot] as well, and stays there until the cog stops
    # building an in-process client at the cutover. That is the one item this
    # split could not close on its own.
    "discord_bot[youtube-music,search-providers]",
]
test = [
    "bandit==1.9.4",
    "fakeredis==2.37.1",
    "freezegun==1.5.5",
    "pylint-pydantic==0.4.1",
    "pylint==4.0.7",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-freezegun==0.4.2",
    "pytest-mock==3.15.1",
    "pytest-postgresql==9.0.0",
    "psycopg[binary]==3.3.4",
    "requests-mock==1.12.1",
    # Currently required for pytest-freezegun, can remove once they have that fixed
    "setuptools==84.0.0",
    "tox==4.60.1",
]

[project.scripts]
discord-bot = "discord_bot.cli.bot:main"
discord-dispatcher = "discord_bot.cli.dispatcher:main"
discord-broker = "discord_bot.cli.broker:main"
discord-downloader = "discord_bot.cli.downloader:main"
discord-search = "discord_bot.cli.search:main"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
exclude = ["tests*", "docs*"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
python_files = ["tests/*.py"]
filterwarnings = [
    "error",
    "error::requests.exceptions.RequestsDependencyWarning",
    # pytest-freezegun uses the deprecated distutils LooseVersion
    "ignore::DeprecationWarning:pytest_freezegun",
    # discord.py imports audioop (deprecated in 3.11, removed in 3.13); message-based because
    # audioop warns with stacklevel=2 so the warning is attributed to discord/player.py, not audioop
    "ignore:'audioop' is deprecated:DeprecationWarning",
    # discord.py calls asyncio.iscoroutinefunction() (deprecated in 3.14, removed in 3.16);
    # message-based because the warning is attributed to discord/ext/commands/core.py, not asyncio
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
    # music.py uses TemporaryDirectory().name to get a path, immediately discarding the object
    # (intentional pattern, see pylint:disable=consider-using-with comments); stdlib cleans them up
    "ignore:Implicitly cleaning up <TemporaryDirectory:ResourceWarning:tempfile",
    # pytest-asyncio leaks an unclosed event loop between tests in Python 3.11; the two AF_UNIX
    # sockets below are the event loop's internal self-pipe wakeup mechanism and disappear with it;
    # this does not reproduce on Python 3.12+ where event loop creation semantics changed
    "ignore:unclosed event loop:ResourceWarning",
    "ignore:unclosed <socket.socket:ResourceWarning",
    # opentelemetry 1.42.0 dropped the importlib_metadata backport in favor of stdlib
    # importlib.metadata; on Python 3.11 entry_points() returns a SelectableGroups mapping
    # whose .values() is deprecated. The class is removed in Python 3.12+, so this only
    # affects py311.
    "ignore:SelectableGroups dict interface is deprecated:DeprecationWarning",
]
